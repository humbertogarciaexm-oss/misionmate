{id:'funcion',eje:'a',title:'Función afín',tag:'f(x) = mx + n',
 lesson:[
  {h:'La función afín es una recta',p:'En <b>f(x) = m·x + n</b>, la <b>pendiente m</b> dice cuánto sube y cada vez que x avanza 1. El <b>coeficiente de posición n</b> dice dónde la recta corta el eje y.',exT:'f(x) = 2x + 1',vis:k=>graph(k),
   steps:[{t:'m = 2 y n = 1',s:'En esta función, la pendiente m es dos, y el coeficiente de posición n es uno.'},
    {t:'x = 0 → f(0) = 2 · 0 + 1 = 1',s:'Si x es cero: dos por cero más uno, da uno. Marco el punto. Ahí la recta corta el eje y: es el valor de n.'},
    {t:'x = 1 → f(1) = 2 · 1 + 1 = 3',s:'Si x es uno: dos por uno más uno, da tres.'},
    {t:'x = 2 → f(2) = 2 · 2 + 1 = 5',s:'Si x es dos: dos por dos más uno, da cinco.'},
    {t:'Cada vez que x avanza 1, y sube 2',s:'Uno los puntos y se forma una recta. Fíjate en la escalera naranja: cada vez que x avanza uno, y sube dos. Eso es la pendiente.'}],
   try:{q:'En f(x) = 5x − 2, ¿cuál es la pendiente?',o:['5','−2','3','x'],a:0,why:'La pendiente es el número que multiplica a x: m = 5. El −2 es el coeficiente de posición.'}},
  {h:'Evaluar una función',p:'Una función es como una máquina: <b>entra un número</b>, la máquina hace el cálculo y <b>sale el resultado</b>.',exT:'f(x) = 3x − 4 &nbsp;·&nbsp; calcula f(5)',
   vis:k=>machine(k>=1?'5':'x','3x − 4',k>=4?'11':'?'),
   steps:[{t:'f(5): donde dice x, pongo 5',s:'f de cinco significa: donde dice x, pongo cinco. Entra el cinco a la máquina.'},
    {t:'f(5) = 3 · 5 − 4',s:'Queda tres por cinco, menos cuatro.'},
    {t:'= 15 − 4',s:'Primero la multiplicación: tres por cinco es quince.'},
    {t:'f(5) = 11',s:'Quince menos cuatro es once. Sale el once: f de cinco es igual a once.'}],
   try:{q:'Si f(x) = 2x + 3, ¿cuánto es f(−1)?',o:['1','5','−5','−1'],a:0,why:'f(−1) = 2 · (−1) + 3 = −2 + 3 = 1.'}},
  {h:'En la vida real',p:'Muchos cobros son funciones afines: un <b>cargo fijo</b> (n) más un <b>valor por cada unidad</b> (m).',exT:'Plan: $5.000 fijo + $1.000 por GB extra',
   vis:k=>k>=3?machine(k>=4?'3 GB':'x','1.000x + 5.000',k>=4?'$8.000':'?'):'',
   steps:[{t:'n = 5.000 → lo que pagas siempre',s:'El cargo fijo de cinco mil pesos se paga siempre, aunque no uses nada. Es el coeficiente de posición.'},
    {t:'m = 1.000 → por cada GB',s:'Cada giga extra cuesta mil pesos. Esa es la pendiente.'},
    {t:'f(x) = 1.000x + 5.000',s:'La función queda: f de x igual a mil x más cinco mil.'},
    {t:'Con 3 GB: f(3) = 3.000 + 5.000 = $8.000',s:'Si usas tres gigas extra: mil por tres es tres mil, más cinco mil, son ocho mil pesos.'}],
   try:{q:'Con el mismo plan, ¿cuánto pagas si no usas GB extra?',o:['$5.000','$0','$1.000','$6.000'],a:0,why:'f(0) = 1.000 · 0 + 5.000 = $5.000. Sin GB extra pagas solo el cargo fijo.'}}],
 gen(l){
  if(l===0){const m=R(2,5),n=R(1,9),k=R(1,6),v=m*k+n;return{type:'num',prompt:`Si f(x) = ${lin(m,n)}, ¿cuánto vale f(${k})?`,answer:v,traps:{[m+k+n]:`Sumaste ${m} + ${k}. Recuerda: ${m}x significa ${m} · x.`},hint:`Reemplaza x por ${k}: calcula ${m} · ${k} y después suma ${n}.`,steps:[`f(${k}) = ${m} · ${k} + ${n}`,`= ${m*k} + ${n} = ${v}`]}}
  if(l===1||l===2){const m=nz(-6,6);let n=nz(-9,9);if(n===m)n=m>0?m+1:m-1;const w=l===1?m:n;
   return{type:'choice',prompt:l===1?'¿Cuál es la pendiente (m) de esta función?':'¿Cuál es el coeficiente de posición (n)?',expr:'f(x) = '+lin(m,n),answer:w,options:opts(w,[l===1?n:m,-w,m+n]),
    traps:l===1?{[n]:'Ese es el coeficiente de posición, el número solo. La pendiente es el que multiplica a x.',[-m]:'Casi: revisa el signo de la pendiente.'}:{[m]:'Esa es la pendiente, porque multiplica a x. Busca el número que está solo.',[-n]:'Casi: revisa el signo. El signo que está delante del número es parte de él.'},
    hint:l===1?'La pendiente es el número que multiplica a x, con su signo.':'El coeficiente de posición es el número que está solo, sin x, con su signo.',steps:[`f(x) = ${lin(m,n)}`,`m = ${N(m)} (multiplica a x)`,`n = ${N(n)} (el número solo)`]}}
  if(l===3){const m=nz(-5,5),n=nz(-9,9),k=nz(-4,5),v=m*k+n;return{type:'num',prompt:`Si f(x) = ${lin(m,n)}, ¿cuánto vale f(${N(k)})?`,answer:v,traps:{[-m*k+n]:'Revisa el signo de la multiplicación: '+P(m)+' · '+P(k)+'.'},hint:`Reemplaza x por ${P(k)}. Cuidado con los signos.`,steps:[`f(${N(k)}) = ${P(m)} · ${P(k)} ${n<0?'−':'+'} ${ab(n)}`,`= ${N(m*k)} ${n<0?'−':'+'} ${ab(n)}`,`= ${N(v)}`]}}
  const fx=pick([3000,4000,5000,6000]),g=pick([500,1000,1500]),x=R(2,8),v=fx+g*x;
  return{type:'num',unit:'$',prompt:`Un plan de celular cobra ${M(fx)} fijos más ${M(g)} por cada GB extra. ¿Cuánto pagas si usas ${x} GB extra?`,expr:`f(x) = ${N(g)}x + ${N(fx)}`,answer:v,traps:{[g*x]:'Calculaste bien los GB. Te faltó sumar el cargo fijo.'},hint:`Reemplaza x por ${x}: multiplica ${N(g)} por ${x} y suma el cargo fijo.`,steps:[`f(${x}) = ${N(g)} · ${x} + ${N(fx)}`,`= ${N(g*x)} + ${N(fx)}`,`= ${M(v)}`]};
 }},
{id:'pitagoras',eje:'g',title:'Teorema de Pitágoras',tag:'Lados del triángulo rectángulo',
 lesson:[
  {h:'Los cuadrados de Pitágoras',p:'En un triángulo rectángulo, el cuadrado construido sobre la <b>hipotenusa</b> tiene la misma área que los cuadrados de los dos <b>catetos</b> juntos.',exT:'Catetos 3 y 4',vis:k=>pythSq(k),
   steps:[{t:'Catetos: a = 3 y b = 4',s:'Este triángulo tiene un ángulo recto. Los lados que forman el ángulo recto son los catetos: miden tres y cuatro.'},
    {t:'Cuadrado sobre a: 3² = 9',s:'Sobre el cateto de tres, construyo un cuadrado. Tiene nueve cuadraditos.'},
    {t:'Cuadrado sobre b: 4² = 16',s:'Sobre el cateto de cuatro, construyo otro cuadrado. Tiene dieciséis cuadraditos.'},
    {t:'Juntos: 9 + 16 = 25',s:'Juntos suman veinticinco cuadraditos.'},
    {t:'Cuadrado sobre c: 25 → c = √25 = 5',s:'El cuadrado sobre la hipotenusa tiene esos mismos veinticinco. Su lado es la raíz de veinticinco: cinco. ¡La hipotenusa mide cinco!'}],
   try:{q:'¿Cuál lado es la hipotenusa?',o:['El más largo, frente al ángulo recto','Cualquiera de los catetos','Siempre el lado de abajo'],a:0,why:'La hipotenusa siempre es el lado más largo y está frente al ángulo recto.'}},
  {h:'Calcular la hipotenusa',p:'Para encontrar la hipotenusa, recuerda tres palabras: <b>elevo, sumo y saco raíz</b>.',exT:'a = 6, b = 8, c = ?',vis:()=>tri(6,8,{a:6,b:8,c:'c = ?'},'c'),
   steps:[{t:'Catetos 6 y 8, buscamos c',s:'Los catetos miden seis y ocho. Buscamos la hipotenusa c.'},
    {t:'Elevo: 6² = 36 y 8² = 64',s:'Elevo cada cateto al cuadrado: seis al cuadrado es treinta y seis, ocho al cuadrado es sesenta y cuatro.'},
    {t:'Sumo: 36 + 64 = 100',s:'Los sumo: treinta y seis más sesenta y cuatro, cien.'},
    {t:'Saco raíz: c = √100 = 10',s:'Saco raíz cuadrada: la raíz de cien es diez. La hipotenusa mide diez.'}],
   try:{q:'Catetos 5 y 12. ¿Cuánto mide la hipotenusa?',o:['13','17','169','7'],a:0,why:'5² + 12² = 25 + 144 = 169, y √169 = 13.'}},
  {h:'Calcular un cateto',p:'Si falta un cateto: <b>elevo, resto y saco raíz</b>. Se resta porque al cuadrado grande le quitas el cuadrado chico.',exT:'c = 13, a = 5, b = ?',vis:()=>tri(5,12,{a:5,b:'b = ?',c:13},'b'),
   steps:[{t:'Hipotenusa 13 y cateto 5, buscamos b',s:'La hipotenusa mide trece y un cateto mide cinco. Buscamos el otro cateto.'},
    {t:'Elevo: 13² = 169 y 5² = 25',s:'Elevo al cuadrado: trece al cuadrado es ciento sesenta y nueve, y cinco al cuadrado es veinticinco.'},
    {t:'Resto: 169 − 25 = 144',s:'Ahora resto: ciento sesenta y nueve menos veinticinco, ciento cuarenta y cuatro.'},
    {t:'Saco raíz: b = √144 = 12',s:'La raíz de ciento cuarenta y cuatro es doce. El cateto mide doce.'}],
   try:{q:'Si conoces la hipotenusa y un cateto, ¿qué haces con los cuadrados?',o:['Los resto','Los sumo','Los multiplico'],a:0,why:'Al cuadrado de la hipotenusa le restas el cuadrado del cateto conocido. Luego sacas raíz.'}}],
 gen(l){
  const T=[[3,4,5],[6,8,10],[5,12,13],[8,15,17],[9,12,15],[12,16,20],[7,24,25],[15,20,25]];
  if(l===4){const [a,b,c]=pick([[5,12,13],[6,8,10],[9,12,15],[8,15,17]]);
   return{type:'num',unit:'m',prompt:`Una escalera de ${c} m está apoyada en una pared. Su base está a ${a} m de la pared. ¿A qué altura llega?`,fig:tri(b,a,{a:'? m',b:a+' m',c:c+' m'},'a'),answer:b,traps:{[b*b]:'Ese es el cuadrado de la altura. Te faltó sacar raíz.',[c-a]:'Los lados no se restan directamente: primero elévalos al cuadrado.'},hint:'La escalera es la hipotenusa. Al cuadrado de la escalera réstale el cuadrado de la distancia en el suelo.',steps:[`${c}² − ${a}² = ${c*c} − ${a*a} = ${b*b}`,`altura = √${b*b} = ${b} m`]}}
  const [a,b,c]=pick(l<2?T.slice(0,5):T);
  if(l<2){const q={prompt:'Calcula la hipotenusa c',sayFig:`Los catetos miden ${a} y ${b}.`,fig:tri(a,b,{a:a,b:b,c:'c = ?'},'c'),answer:c,traps:{[a+b]:'No se suman los lados directamente: primero elévalos al cuadrado.',[c*c]:'Ese es c². Te faltó sacar la raíz cuadrada.'},hint:'Elevo, sumo y saco raíz: suma los cuadrados de los catetos y luego saca raíz.',steps:[`${a}² + ${b}² = ${a*a} + ${b*b} = ${c*c}`,`c = √${c*c} = ${c}`]};
   if(l===0){q.type='choice';q.options=opts(c,[a+b,c*c,c+1])}else q.type='num';return q}
  if(l===2)return{type:'num',prompt:'Calcula el cateto b',sayFig:`La hipotenusa mide ${c} y un cateto mide ${a}.`,fig:tri(a,b,{a:a,b:'b = ?',c:c},'b'),answer:b,traps:{[b*b]:'Ese es b². Te faltó sacar raíz.',[c-a]:'Los lados no se restan directamente: primero elévalos al cuadrado.'},hint:'Elevo, resto y saco raíz: al cuadrado de la hipotenusa réstale el cuadrado del cateto conocido.',steps:[`${c}² − ${a}² = ${c*c} − ${a*a} = ${b*b}`,`b = √${b*b} = ${b}`]};
  return{type:'num',prompt:'Calcula el cateto a',sayFig:`La hipotenusa mide ${c} y un cateto mide ${b}.`,fig:tri(a,b,{a:'a = ?',b:b,c:c},'a'),answer:a,traps:{[a*a]:'Ese es a². Te faltó sacar raíz.',[c-b]:'Los lados no se restan directamente: primero elévalos al cuadrado.'},hint:'Elevo, resto y saco raíz: al cuadrado de la hipotenusa réstale el cuadrado del cateto conocido.',steps:[`${c}² − ${b}² = ${c*c} − ${b*b} = ${a*a}`,`a = √${a*a} = ${a}`]};
 }}
];


/* ================= 1° a 4° medio ================= */
const sgn=(v,first)=>first?(v<0?'−':''):(v<0?' − ':' + ');
function polyQ(b,c){return 'x²'+(b===0?'':sgn(b)+(ab(b)===1?'':ab(b))+'x')+(c===0?'':sgn(c)+ab(c))}
const binom=(a)=>`(x ${a<0?'−':'+'} ${ab(a)})`;
const circEq=(h,k,r)=>`${h===0?'x²':`(x ${h>0?'−':'+'} ${ab(h)})²`} + ${k===0?'y²':`(y ${k>0?'−':'+'} ${ab(k)})²`} = ${r}`;
const TRIP=[[3,4,5],[6,8,10],[5,12,13],[8,15,17],[9,12,15],[12,16,20],[7,24,25],[15,20,25]];

const M1={id:'m1',name:'1° medio',topics:[
{id:'m1-potencias',eje:'n',title:'Potencias de exponente entero',tag:'Exponente cero y negativo',
 lesson:[
  C('Exponente cero','Al dividir potencias de igual base se <b>restan</b> los exponentes. Así se descubre qué pasa con el exponente cero.','5⁰',
   [['5³ : 5³ = 5³⁻³ = 5⁰','Cinco al cubo dividido en cinco al cubo: se restan los exponentes y queda cinco elevado a cero.'],['Pero 125 : 125 = 1','Pero ciento veinticinco dividido en ciento veinticinco es uno.'],['Entonces 5⁰ = 1','Entonces cinco elevado a cero es uno.'],['Todo número distinto de 0, elevado a 0, es 1','Esto vale para cualquier número distinto de cero.']],
   ['¿Cuánto es 7⁰?',['1','0','7'],0,'Cualquier número distinto de 0 elevado a 0 es 1.']),
  C('Exponente negativo','Un exponente negativo significa <b>invertir la base</b>: pasa al denominador con exponente positivo.','2⁻³',
   [['Exponente negativo → invierto la base','El exponente es negativo, así que invierto la base: el dos pasa abajo.'],[`2⁻³ = ${F(1,'2³')}`,'Dos elevado a menos tres es uno sobre dos al cubo.'],[`= ${F(1,8)}`,'Dos al cubo es ocho, así que el resultado es un octavo.'],['Ojo: no da un número negativo','Cuidado: el exponente negativo no hace negativo el resultado.']],
   ['¿Cuánto es 3⁻²?',[F(1,9),'−9','−6'],0,`3⁻² = ${F(1,'3²')} = ${F(1,9)}.`])],
 gen(l){
  if(l===0){const a=R(2,99);return qc(`¿Cuánto es ${a}${sup(0)}?`,1,opts(1,[0,a,-1]),'Recuerda qué pasa con el exponente cero.',['Todo número distinto de 0 elevado a 0 es 1',`${a}${sup(0)} = 1`],{traps:{[0]:'Elevado a 0 no da 0: da 1.',[a]:'Elevado a 0 no deja el número igual: da 1.'}})}
  if(l===1){let a,n;do{a=R(2,5);n=R(1,3)}while(a**n>125);const ans=F(1,a**n);return qc(`¿Cuánto es ${a}${sup('−'+n)}?`,ans,optsS(ans,['−'+N(a**n),'−'+N(a*n),F(1,a*n),F(a**n,1)].filter(x=>x!==ans)),'Exponente negativo: invierte la base.',[`${a}${sup('−'+n)} = ${F(1,a+sup(n))}`,`= ${ans}`],{traps:{['−'+N(a**n)]:'El exponente negativo no hace negativo el resultado: invierte la base.'}})}
  const a=R(2,9),m=nz(-6,6),n=nz(-6,6);
  if(l===2)return qn(`${a}${sup(N(m))} · ${a}${sup(N(n))} = ${a}${sup('?')}. ¿Cuál es el exponente?`,m+n,'Igual base en una multiplicación: se suman los exponentes.',[`${N(m)} + ${P(n)} = ${N(m+n)}`,`Resultado: ${a}${sup(N(m+n))}`],{traps:{[m*n]:'Multiplicaste los exponentes. En una multiplicación de igual base se suman.'}});
  if(l===3)return qn(`${a}${sup(N(m))} : ${a}${sup(N(n))} = ${a}${sup('?')}. ¿Cuál es el exponente?`,m-n,'Igual base en una división: se restan los exponentes.',[`${N(m)} − ${P(n)} = ${N(m-n)}`,`Resultado: ${a}${sup(N(m-n))}`],{traps:{[m+n]:'En una división de igual base los exponentes se restan.'}});
  return qn(`(${a}${sup(N(m))})${sup(N(n))} = ${a}${sup('?')}. ¿Cuál es el exponente?`,m*n,'Potencia de una potencia: se multiplican los exponentes.',[`${N(m)} · ${P(n)} = ${N(m*n)}`,`Resultado: ${a}${sup(N(m*n))}`],{traps:{[m+n]:'En una potencia de potencia los exponentes se multiplican.'}});
 }},
{id:'m1-prodnot',eje:'a',title:'Productos notables',tag:'Cuadrado de binomio y suma por diferencia',
 lesson:[
  C('Cuadrado de binomio','(x + 3)² es el área de un cuadrado de lado <b>x + 3</b>. Al dividirlo aparecen cuatro partes.','(x + 3)²',
   [['(x + 3)² = (x + 3)(x + 3)','Equis más tres al cuadrado es equis más tres, multiplicado por equis más tres.'],['x · x = x²','La parte grande: equis por equis, equis al cuadrado.'],['x · 3, dos veces: 3x + 3x = 6x','Hay dos rectángulos de equis por tres. Juntos son seis equis.'],['3 · 3 = 9','El cuadrado chico: tres por tres, nueve.'],['(x + 3)² = x² + 6x + 9','Junto todo: equis al cuadrado, más seis equis, más nueve.']],
   ['¿Cuánto es (x + 5)²?',['x² + 10x + 25','x² + 25','x² + 5x + 25'],0,'Cuadrado del primero + doble del primero por el segundo + cuadrado del segundo: x² + 10x + 25.'],
   k=>areaSq(3,k)),
  C('Suma por diferencia','(x + a)(x − a): los términos del medio <b>se anulan</b>.','(x + 4)(x − 4)',
   [['x · x = x²','Primero por primero: equis por equis, equis al cuadrado.'],['x · (−4) + 4 · x = −4x + 4x = 0','Los términos del medio: menos cuatro equis más cuatro equis. Se anulan.'],['4 · (−4) = −16','Último por último: cuatro por menos cuatro, menos dieciséis.'],['(x + 4)(x − 4) = x² − 16','El resultado es equis al cuadrado menos dieciséis.']],
   ['¿Cuánto es (x + 6)(x − 6)?',['x² − 36','x² + 36','x² − 12x + 36'],0,'Suma por diferencia: x² − 6² = x² − 36.'])],
 gen(l){
  const a=R(2,9);
  if(l===0){const ans=polyQ(2*a,a*a);return qc(`¿Cuánto es (x + ${a})²?`,ans,optsS(ans,[polyQ(0,a*a),polyQ(a,a*a),polyQ(2*a,2*a)]),'Cuadrado del primero, más el doble del primero por el segundo, más el cuadrado del segundo.',[`x² + 2 · x · ${a} + ${a}²`,`= ${ans}`],{traps:{[polyQ(0,a*a)]:'Falta el término del medio: 2 · x · '+a+'.'}})}
  if(l===1){const ans=polyQ(-2*a,a*a);return qc(`¿Cuánto es (x − ${a})²?`,ans,optsS(ans,[polyQ(0,-a*a),polyQ(2*a,a*a),polyQ(-2*a,-a*a)]),'El término del medio lleva el signo menos. El último siempre es positivo.',[`x² − 2 · x · ${a} + ${a}²`,`= ${ans}`])}
  if(l===2){const ans=polyQ(0,-a*a);return qc(`¿Cuánto es (x + ${a})(x − ${a})?`,ans,optsS(ans,[polyQ(0,a*a),polyQ(-2*a,a*a),polyQ(0,-2*a)]),'Suma por diferencia: los términos del medio se anulan.',[`x² − ${a}x + ${a}x − ${a*a}`,`= ${ans}`])}
  if(l===3)return qn(`(x + ${a})² = x² + ___x + ${a*a}. ¿Qué número falta?`,2*a,'El término del medio es el doble del primero por el segundo.',[`2 · x · ${a} = ${2*a}x`],{traps:{[a]:`Falta el doble: el término del medio es 2 · ${a} · x.`}});
  const b=R(2,9);return qn(`(x + ${a})(x + ${b}) = x² + ___x + ${a*b}. ¿Qué número falta?`,a+b,'Términos con número común: el del medio es la suma de los números.',[`x · ${b} + ${a} · x = ${a+b}x`,`Resultado: ${polyQ(a+b,a*b)}`],{traps:{[a*b]:'Ese es el último término. El del medio es la suma.'}});
 }},
{id:'m1-sistemas',eje:'a',title:'Sistemas de ecuaciones',tag:'Dos ecuaciones, dos incógnitas',
 lesson:[
  C('Método de reducción','Si sumas o restas las ecuaciones, una incógnita <b>desaparece</b>.','x + y = 10 ; x − y = 4',
   [['Sumo las ecuaciones: 2x = 14','Sumo las dos ecuaciones. La y positiva y la y negativa se anulan, y queda dos equis igual a catorce.'],['x = 7','Divido por dos: equis es siete.'],['Reemplazo: 7 + y = 10 → y = 3','Reemplazo en la primera: siete más y es diez. Entonces y es tres.'],['Compruebo: 7 − 3 = 4 ✓','Compruebo en la segunda: siete menos tres es cuatro. ¡Correcto!']],
   ['Si x + y = 8 y x − y = 2, ¿cuánto vale x?',['5','3','10'],0,'Sumo: 2x = 10, así que x = 5.']),
  C('Un problema con sistema','Muchos problemas tienen <b>dos datos desconocidos</b>. Con dos ecuaciones se pueden resolver.','10 animales y 28 patas: gallinas y vacas',
   [['g + v = 10 (cabezas)','Cada animal tiene una cabeza: gallinas más vacas es diez.'],['2g + 4v = 28 (patas)','Las gallinas tienen dos patas y las vacas cuatro: dos g más cuatro v es veintiocho.'],['Duplico la primera: 2g + 2v = 20','Multiplico la primera ecuación por dos.'],['Resto: 2v = 8 → v = 4','Resto las ecuaciones: dos v es ocho. Hay cuatro vacas.'],['g = 10 − 4 = 6','Y gallinas: diez menos cuatro, seis.']],
   ['Si hay 5 animales y 14 patas, ¿cuántas vacas hay?',['2','3','4'],0,'g + v = 5 y 2g + 4v = 14. Duplico la primera: 2g + 2v = 10. Resto: 2v = 4, v = 2.'])],
 gen(l){
  if(l<2){let x=R(2,12),y=R(1,11);if(y>=x)[x,y]=[y+1,x];const s=x+y,d=x-y;const st=[`Sumo: 2x = ${s} + ${d} = ${s+d}`,`x = ${x}`,`Reemplazo: ${x} + y = ${s} → y = ${y}`];return qn(`Resuelve: x + y = ${s} ; x − y = ${d}. ¿Cuánto vale ${l?'y':'x'}?`,l?y:x,l?'Primero encuentra x sumando las ecuaciones; luego reemplaza.':'Suma las ecuaciones para que la y desaparezca.',st,{traps:l?{[x]:'Ese es el valor de x. La pregunta es por y.'}:{[y]:'Ese es el valor de y.'}})}
  if(l===2){const x=R(1,9),y=R(1,9),p=2*x+y,q=x+y;return qn(`Resuelve: 2x + y = ${p} ; x + y = ${q}. ¿Cuánto vale x?`,x,'Resta la segunda ecuación a la primera.',[`(2x + y) − (x + y) = ${p} − ${q}`,`x = ${x}`,`y = ${q} − ${x} = ${y}`])}
  if(l===3){const g=R(2,12),v=R(2,10),H=g+v,L=2*g+4*v;return qn(`En una granja hay gallinas y vacas: ${H} cabezas y ${L} patas. ¿Cuántas vacas hay?`,v,'Plantea: g + v = cabezas y 2g + 4v = patas.',[`g + v = ${H} y 2g + 4v = ${L}`,`Duplico la primera: 2g + 2v = ${2*H}`,`Resto: 2v = ${L-2*H} → v = ${v}`],{traps:{[g]:'Esas son las gallinas. La pregunta es por las vacas.'}})}
  let a=R(10,40),b=R(2,a-2);const S=a+b,D=a-b;return qn(`Dos números suman ${S} y su diferencia es ${D}. ¿Cuál es el número mayor?`,a,'x + y = suma y x − y = diferencia. Suma las ecuaciones.',[`x + y = ${S} ; x − y = ${D}`,`2x = ${S+D} → x = ${a}`,`El otro es ${S} − ${a} = ${b}`]);
 }},
{id:'m1-proba',eje:'d',title:'Probabilidad',tag:'Casos favorables y posibles',
 lesson:[
  C('Regla de Laplace','Si todos los resultados tienen la misma posibilidad: <b>P = casos favorables / casos posibles</b>.','Lanzar un dado y sacar un número par',
   [['Casos posibles: 6 (del 1 al 6)','El dado tiene seis caras: seis casos posibles.'],['Favorables: 2, 4 y 6 → 3','Los números pares son dos, cuatro y seis: tres casos favorables.'],[`P = ${F(3,6)} = ${F(1,2)}`,'La probabilidad es tres sextos, que simplificado es un medio.']],
   ['¿Cuál es la probabilidad de sacar un 5 en un dado?',[F(1,6),F(5,6),F(1,5)],0,'Hay 1 caso favorable (el 5) de 6 posibles.'],
   k=>chipsRow([1,2,3,4,5,6].map(v=>({t:v,c:k>=2&&v%2===0?'hl':''})))),
  C('Probabilidad en porcentaje','Una probabilidad también se puede escribir como <b>decimal</b> o <b>porcentaje</b>.','Bolsa con 3 bolitas rojas y 7 azules',
   [['Posibles: 3 + 7 = 10','En total hay diez bolitas.'],['Favorables (rojas): 3','Las rojas son tres.'],[`P(roja) = ${F(3,10)} = 0,3 = 30%`,'La probabilidad de sacar roja es tres décimos: cero coma tres, o treinta por ciento.']],
   ['Si P(A) = 0,25, ¿cuánto es en porcentaje?',['25%','2,5%','0,25%'],0,'0,25 · 100 = 25%.'])],
 gen(l){
  if(l===0){const ev=pick([['un número par',[2,4,6]],['un número mayor que 4',[5,6]],['un 6',[6]],['un número menor que 3',[1,2]],['un múltiplo de 3',[3,6]],['un número impar',[1,3,5]]]),f=ev[1].length,ans=FS(f,6);return qc(`Al lanzar un dado, ¿cuál es la probabilidad de sacar ${ev[0]}?`,ans,optsS(ans,[FS(6-f,6),F(f,12),f===1?F(1,2):F(1,6)].filter(x=>x!==ans)),'Cuenta los casos favorables y divide por 6.',[`Favorables: ${ev[1].join(', ')} → ${f}`,'Posibles: 6',`P = ${F(f,6)}${gcd(f,6)>1?' = '+ans:''}`])}
  if(l===1){const t=pick([10,20,25,50]),r=R(1,t-1);return qn(`En una bolsa hay ${r} bolitas rojas y ${t-r} azules. ¿Cuál es la probabilidad de sacar una roja, en porcentaje?`,r/t*100,'Favorables entre posibles, y luego multiplica por 100.',[`Posibles: ${t}`,`P = ${F(r,t)} = ${N(r/t)}`,`${N(r/t)} · 100 = ${N(r/t*100)}%`],{unit:'%'})}
  if(l===2){const ev=pick([['salgan dos caras',F(1,4),'CC'],['salga una cara y un sello (en cualquier orden)',F(1,2),'CS y SC'],['salga al menos una cara',F(3,4),'CC, CS y SC']]);return qc(`Lanzas dos monedas. ¿Cuál es la probabilidad de que ${ev[0]}?`,ev[1],optsS(ev[1],[F(1,4),F(1,2),F(3,4),F(1,3)].filter(x=>x!==ev[1])),'Escribe todos los resultados: CC, CS, SC, SS.',['Resultados posibles: CC, CS, SC, SS → 4',`Favorables: ${ev[2]}`,`P = ${ev[1]}`])}
  if(l===3){const t=pick([20,40,50]),p=pick([10,20,30,40]);return qn(`Una urna tiene ${t} bolitas. La probabilidad de sacar una verde es ${p}%. ¿Cuántas bolitas verdes hay?`,t*p/100,`Calcula el ${p}% de ${t}.`,[`${p}% de ${t} = ${t} · ${p} : 100`,`= ${t*p/100} bolitas verdes`])}
  const p=R(5,95);return qn(`La probabilidad de que llueva mañana es ${p}%. ¿Cuál es la probabilidad de que NO llueva?`,100-p,'Las dos probabilidades juntas suman 100%.',[`100% − ${p}% = ${100-p}%`],{unit:'%'});
 }}]};

const M2={id:'m2',name:'2° medio',topics:[
{id:'m2-raices',eje:'n',title:'Raíces',tag:'Raíces enésimas y exponente fraccionario',
 lesson:[
  C('Raíz cúbica','La raíz cúbica <b>∛</b> busca el número que, elevado al cubo, da el número de adentro.','∛8',
   [['∛8: ¿qué número al cubo da 8?','Raíz cúbica de ocho: ¿qué número multiplicado tres veces por sí mismo da ocho?'],['2 · 2 · 2 = 8','Dos por dos por dos es ocho.'],['∛8 = 2','Entonces la raíz cúbica de ocho es dos.']],
   ['¿Cuánto es ∜16?',['2','4','8'],0,'2 · 2 · 2 · 2 = 16, así que ∜16 = 2.']),
  C('Multiplicar raíces','Las raíces del mismo índice se pueden <b>juntar</b>: √a · √b = √(a · b).','√2 · √8',
   [['√a · √b = √(a · b)','Las raíces cuadradas se pueden juntar en una sola multiplicando lo de adentro.'],['√2 · √8 = √16','Raíz de dos por raíz de ocho es raíz de dieciséis.'],['√16 = 4','Y la raíz de dieciséis es cuatro.']],
   ['¿Cuánto es √3 · √12?',['6','36','15'],0,'√3 · √12 = √36 = 6.']),
  C('Exponente fraccionario','Un exponente <b>1/n</b> es lo mismo que una raíz de índice n.','27<sup>1/3</sup>',
   [['Exponente 1/3 = raíz cúbica','El exponente un tercio significa raíz cúbica.'],['27<sup>1/3</sup> = ∛27','Veintisiete elevado a un tercio es la raíz cúbica de veintisiete.'],['3 · 3 · 3 = 27 → ∛27 = 3','Tres por tres por tres es veintisiete. El resultado es tres.']],
   ['¿Cuánto es 25<sup>1/2</sup>?',['5','12,5','625'],0,'Exponente 1/2 es raíz cuadrada: √25 = 5.'])],
 gen(l){
  if(l===0){const n=R(2,5);return qc(`¿Cuánto es ∛${n**3}?`,n,opts(n,[n**3/3|0||n+2,n*n,n+1]),'Busca un número que multiplicado tres veces dé '+n**3+'.',[`${n} · ${n} · ${n} = ${n**3}`,`∛${n**3} = ${n}`],{traps:{[Math.round(n**3/3)]:'La raíz cúbica no es dividir por 3.'}})}
  if(l===1){const c=pick([[3,R(2,6)],[4,R(2,3)]]),i=c[0],n=c[1],v=n**i,sym=i===3?'∛':'∜';return qn(`¿Cuánto es ${sym}${v}?`,n,`Busca un número que multiplicado ${i} veces dé ${v}.`,[`${rep(i,n).join(' · ')} = ${v}`,`${sym}${v} = ${n}`])}
  if(l===2){const [a,b]=pick([[2,8],[3,12],[2,18],[5,20],[3,27],[2,32],[6,24]]),v=Math.sqrt(a*b);return qn(`¿Cuánto es √${a} · √${b}?`,v,'Junta las raíces: √(a · b).',[`√${a} · √${b} = √${a*b}`,`√${a*b} = ${v}`])}
  if(l===3){const m=pick([2,3,5]),k=R(2,5);return qn(`Simplifica: √${k*k*m} = ___ · √${m}`,k,`Separa ${k*k*m} en un cuadrado perfecto por ${m}.`,[`${k*k*m} = ${k*k} · ${m}`,`√${k*k*m} = √${k*k} · √${m}`,`= ${k}√${m}`])}
  const [a,n]=pick([[8,3],[27,3],[16,4],[25,2],[64,3],[81,4],[49,2]]),v=Math.round(a**(1/n)),sym={2:'√',3:'∛',4:'∜'}[n];return qn(`¿Cuánto es ${a}${sup('1/'+n)}?`,v,`Exponente 1/${n} es una raíz de índice ${n}.`,[`${a}${sup('1/'+n)} = ${sym}${a}`,`= ${v}`],{traps:{[a/n]:'El exponente fraccionario no es dividir: es una raíz.'}});
 }},
{id:'m2-log',eje:'n',title:'Logaritmos',tag:'¿A qué exponente?',
 lesson:[
  C('El logaritmo es un exponente','log₂ 8 pregunta: <b>¿a qué exponente hay que elevar 2 para obtener 8?</b>','log₂ 8',
   [['log₂ 8 → ¿2 elevado a qué da 8?','Logaritmo en base dos de ocho. La pregunta es: ¿dos elevado a qué da ocho?'],['2³ = 8','Dos al cubo es ocho.'],['log₂ 8 = 3','Entonces el logaritmo es tres.']],
   ['¿Cuánto es log₃ 9?',['2','3','27'],0,'3² = 9, así que log₃ 9 = 2.'],
   k=>chipsRow([{t:'2¹ = 2'},{t:'2² = 4'},{t:'2³ = 8',c:k>=2?'hl':''},{t:'2⁴ = 16'}])),
  C('Logaritmo en base 10','Cuando no se escribe la base, es <b>10</b>. Cuenta los ceros.','log 1.000',
   [['Sin base escrita → base 10','Si no aparece la base, es diez.'],['10³ = 1.000','Diez al cubo es mil.'],['log 1.000 = 3','El logaritmo de mil es tres. Fíjate: mil tiene tres ceros.'],['log 0,01 = −2 porque 10⁻² = 0,01','Y para decimales: el logaritmo de cero coma cero uno es menos dos.']],
   ['¿Cuánto es log 100.000?',['5','4','10.000'],0,'10⁵ = 100.000, así que log 100.000 = 5.'])],
 gen(l){
  if(l===0){const k=R(1,6),v=2**k;return qc(`¿Cuánto es log${sub(2)} ${v}?`,k,opts(k,[v/2,k+1,v]),`¿2 elevado a qué da ${v}?`,[`2${sup(k)} = ${v}`,`log${sub(2)} ${v} = ${k}`],{traps:{[v/2]:'El logaritmo no es dividir por la base. Es el exponente.'}})}
  if(l===1){const b=pick([3,5]),k=R(1,b===3?4:3),v=b**k;return qn(`¿Cuánto es log${sub(b)} ${v}?`,k,`¿${b} elevado a qué da ${v}?`,[`${b}${sup(k)} = ${N(v)}`,`log${sub(b)} ${v} = ${k}`])}
  if(l===2){const k=R(1,6),v=10**k;return qn(`¿Cuánto es log ${N(v)}?`,k,'Base 10: cuenta los ceros.',[`10${sup(k)} = ${N(v)}`,`log ${N(v)} = ${k}`])}
  if(l===3){const b=pick([2,3]),k=R(2,b===2?6:4);return qn(`Si log${sub(b)} x = ${k}, ¿cuánto vale x?`,b**k,`El logaritmo es el exponente: x = ${b} elevado a ${k}.`,[`log${sub(b)} x = ${k} significa ${b}${sup(k)} = x`,`x = ${b**k}`],{traps:{[b*k]:`Multiplicaste. Hay que elevar: ${b}${sup(k)}.`}})}
  const k=R(1,3),v=10**-k;return qn(`¿Cuánto es log ${N(v)}?`,-k,'Escribe el número como potencia de 10 con exponente negativo.',[`${N(v)} = 10${sup('−'+k)}`,`log ${N(v)} = −${k}`],{traps:{[k]:'Revisa el signo: el número es menor que 1, así que el logaritmo es negativo.'}});
 }},
{id:'m2-cuadratica',eje:'a',title:'Ecuación cuadrática',tag:'x² en la ecuación',
 lesson:[
  C('La ecuación x² = k','Una ecuación con x² puede tener <b>dos soluciones</b>: una positiva y una negativa.','x² = 49',
   [['¿Qué número al cuadrado da 49?','¿Qué número multiplicado por sí mismo da cuarenta y nueve?'],['7² = 49 y (−7)² = 49','Siete al cuadrado es cuarenta y nueve. Y menos siete al cuadrado también.'],['x = 7 o x = −7','Hay dos soluciones: siete y menos siete.']],
   ['¿Cuántas soluciones tiene x² = 25?',['Dos: 5 y −5','Una: 5','Ninguna'],0,'5² = 25 y (−5)² = 25.']),
  C('Resolver factorizando','Busca dos números que <b>multiplicados</b> den el término libre y <b>sumados</b> den el coeficiente de x.','x² − 5x + 6 = 0',
   [['Busco dos números: producto 6 y suma −5','Busco dos números que multiplicados den seis y sumados den menos cinco.'],['Son −2 y −3','Son menos dos y menos tres: menos dos por menos tres es seis, y sumados dan menos cinco.'],['(x − 2)(x − 3) = 0','Escribo la ecuación factorizada.'],['x = 2 o x = 3','Un producto es cero si uno de los factores es cero. Las soluciones son dos y tres.']],
   ['¿Cuáles son las soluciones de x² − 7x + 10 = 0?',['2 y 5','−2 y −5','3 y 4'],0,'2 · 5 = 10 y 2 + 5 = 7: (x − 2)(x − 5) = 0.'])],
 gen(l){
  if(l<2){const k=R(2,l?15:9);const st=[`${k}² = ${k*k} y (−${k})² = ${k*k}`,`x = ${k} o x = −${k}`];return l===0?qc(`x² = ${k*k}. ¿Cuál es la solución positiva?`,k,opts(k,[k*k/2,2*k,k+1].filter(Number.isInteger)),'¿Qué número al cuadrado da '+k*k+'?',st,{traps:{[k*k/2]:'No es dividir por 2: es sacar raíz cuadrada.'}}):qn(`x² = ${k*k}. ¿Cuál es la solución positiva?`,k,'Saca raíz cuadrada.',st)}
  let r1,r2;
  if(l===2){r1=R(1,9);do{r2=R(1,9)}while(r2===r1)}else{r1=R(1,8);r2=-R(1,8);if(r1+r2===0)r1++}
  const s=r1+r2,p=r1*r2,eq=polyQ(-s,p)+' = 0',st=[`Busco dos números: producto ${N(p)} y suma ${N(s)}`,`Son ${N(r1)} y ${N(r2)}`,`${binom(-r1)}${binom(-r2)} = 0`,`x = ${N(r1)} o x = ${N(r2)}`];
  if(l===2)return qn(`${eq}. ¿Cuál es la solución mayor?`,Math.max(r1,r2),'Factoriza: busca dos números con ese producto y esa suma.',st);
  if(l===3)return qn(`${eq}. ¿Cuál es la solución menor?`,Math.min(r1,r2),'Factoriza: busca dos números con ese producto y esa suma.',st,{traps:{[-Math.min(r1,r2)]:'Revisa el signo: si el factor es (x + a), la solución es −a.'}});
  return qn(`${eq}. ¿Cuánto suman sus dos soluciones?`,s,'Encuentra las dos soluciones y súmalas.',[...st,`${N(r1)} + ${P(r2)} = ${N(s)}`]);
 }},
{id:'m2-trigo',eje:'g',title:'Razones trigonométricas',tag:'Seno, coseno y tangente',
 lesson:[
  C('Seno, coseno y tangente','En un triángulo rectángulo, mirando el ángulo <b>α</b>: el <b>opuesto</b> está enfrente, el <b>adyacente</b> lo toca, y la <b>hipotenusa</b> es el lado más largo.','Triángulo de lados 3, 4 y 5',
   [['Opuesto a α: 3 · adyacente: 4 · hipotenusa: 5','Frente al ángulo alfa está el lado tres: es el opuesto. El lado cuatro toca al ángulo: es el adyacente. La hipotenusa mide cinco.'],[`sen α = opuesto / hipotenusa = ${F(3,5)}`,'El seno es opuesto partido por hipotenusa: tres quintos.'],[`cos α = adyacente / hipotenusa = ${F(4,5)}`,'El coseno es adyacente partido por hipotenusa: cuatro quintos.'],[`tan α = opuesto / adyacente = ${F(3,4)}`,'La tangente es opuesto partido por adyacente: tres cuartos.']],
   ['¿Qué razón es opuesto / hipotenusa?',['Seno','Coseno','Tangente'],0,'Seno = opuesto / hipotenusa.'],
   ()=>tri(3,4,{a:'3',b:'4',c:'5'},null,true)),
  C('Calcular un lado','Si conoces un ángulo y un lado, puedes calcular otro lado.','Rampa de 10 m con ángulo de 30°',
   [['La rampa es la hipotenusa: 10 m','La rampa mide diez metros: es la hipotenusa.'],['Busco la altura: es el opuesto','La altura está frente al ángulo: es el lado opuesto. Uso el seno.'],['sen 30° = 0,5','El seno de treinta grados es cero coma cinco.'],['altura = 10 · 0,5 = 5 m','Altura igual a diez por cero coma cinco: cinco metros.']],
   ['Si la hipotenusa mide 8 y el ángulo es 30°, ¿cuánto mide el opuesto?',['4','16','8'],0,'opuesto = 8 · sen 30° = 8 · 0,5 = 4.'])],
 gen(l){
  const [a,b,c]=pick(TRIP),fig=tri(a,b,{a:a,b:b,c:c},null,true),base=[`Opuesto a α: ${a} · adyacente: ${b} · hipotenusa: ${c}`];
  if(l<3){const nm=['sen','cos','tan'][l],ans=[FS(a,c),FS(b,c),FS(a,b)][l],ds=[FS(a,c),FS(b,c),FS(a,b),FS(c,a),FS(b,a)].filter(x=>x!==ans),def=['opuesto / hipotenusa','adyacente / hipotenusa','opuesto / adyacente'][l];return qc(`¿Cuánto es ${nm} α?`,ans,optsS(ans,ds),`${nm} α = ${def}.`,[...base,`${nm} α = ${def} = ${ans}`],{fig})}

  const L=pick([6,8,10,12,20]);return qn(`Una rampa de ${L} m forma un ángulo de 30° con el suelo. ¿A qué altura llega? (sen 30° = 0,5)`,L/2,'La altura es el lado opuesto al ángulo. Usa el seno.',['sen 30° = altura / rampa',`altura = ${L} · 0,5`,`= ${N(L/2)} m`],{unit:'m'});
 }}]};

const M3={id:'m3',name:'3° medio',topics:[
{id:'m3-dispersion',eje:'d',title:'Medidas de dispersión',tag:'Rango, varianza y desviación estándar',
 lesson:[
  C('Rango','El <b>rango</b> mide qué tan separados están los datos: dato mayor menos dato menor.','Temperaturas: 8, 12, 15, 10 °C',
   [['Dato mayor: 15','El dato mayor es quince.'],['Dato menor: 8','El dato menor es ocho.'],['Rango = 15 − 8 = 7','El rango es quince menos ocho: siete grados.']],
   ['Datos: 3, 9, 4, 12. ¿Cuál es el rango?',['9','12','3'],0,'12 − 3 = 9.']),
  C('Varianza y desviación estándar','La <b>desviación estándar</b> (σ) dice cuánto se alejan los datos del promedio, en promedio.','Datos: 2, 4, 4, 4, 5, 5, 7, 9',
   [['Promedio: 40 : 8 = 5','Primero el promedio: la suma es cuarenta, y hay ocho datos. El promedio es cinco.'],['Distancias al promedio, al cuadrado: 9, 1, 1, 1, 0, 0, 4, 16','Calculo cuánto se aleja cada dato del cinco y lo elevo al cuadrado: nueve, uno, uno, uno, cero, cero, cuatro y dieciséis.'],['Varianza: 32 : 8 = 4','La varianza es el promedio de esos cuadrados: treinta y dos dividido en ocho, cuatro.'],['σ = √4 = 2','La desviación estándar es la raíz de la varianza: dos.'],['σ chica → datos juntos; σ grande → datos dispersos','Si sigma es chica, los datos están juntos. Si es grande, están dispersos.']],
   ['El curso A tiene σ = 1 y el curso B tiene σ = 5. ¿Cuál tiene notas más parejas?',['A','B'],0,'Una desviación estándar menor significa datos más juntos, más parejos.'])],
 gen(l){
  if(l===0){const d=Array.from({length:5},()=>R(1,30)),mx=Math.max(...d),mn=Math.min(...d);return qn(`Datos: ${d.join(', ')}. ¿Cuál es el rango?`,mx-mn,'Dato mayor menos dato menor.',[`Mayor: ${mx}; menor: ${mn}`,`Rango = ${mx} − ${mn} = ${mx-mn}`],{traps:{[mx]:'Ese es el dato mayor. Falta restarle el menor.'}})}
  if(l===1){const m=R(4,6),A=[m-1,m,m+1],B=[m-3,m,m+3],aIsTight=R(0,1)===1,g1=aIsTight?A:B,g2=aIsTight?B:A,ans=aIsTight?'Grupo 2':'Grupo 1';return qc(`Grupo 1: ${g1.join(', ')} · Grupo 2: ${g2.join(', ')}. Los dos tienen promedio ${m}. ¿Cuál es más disperso?`,ans,['Grupo 1','Grupo 2'],'Mira qué tan lejos del promedio están los datos.',[`Grupo con ${B.join(', ')}: se aleja 3 del promedio`,`Grupo con ${A.join(', ')}: se aleja solo 1`,`Más disperso: ${ans}`])}
  if(l===2){let d;do{d=Array.from({length:4},()=>R(2,20))}while(d.reduce((a,b)=>a+b)%4);const s=d.reduce((a,b)=>a+b);return qn(`¿Cuál es el promedio de ${d.join(', ')}?`,s/4,'Suma y divide por 4.',[`${d.join(' + ')} = ${s}`,`${s} : 4 = ${s/4}`])}
  const m=R(5,20),d=R(1,5);
  if(l===3)return qn(`Datos: ${m-d} y ${m+d}. ¿Cuál es la varianza?`,d*d,'Calcula el promedio, las distancias al cuadrado y promédialas.',[`Promedio: ${m}`,`Distancias: ${d} y ${d}; al cuadrado: ${d*d} y ${d*d}`,`Varianza: (${d*d} + ${d*d}) : 2 = ${d*d}`],{traps:{[d]:'Esa es la desviación estándar. La varianza es su cuadrado.'}});
  return qn(`Datos: ${m-d}, ${m-d}, ${m+d}, ${m+d}. ¿Cuál es la desviación estándar?`,d,'Calcula la varianza y después saca raíz cuadrada.',[`Promedio: ${m}`,`Cada dato se aleja ${d}; al cuadrado: ${d*d}`,`Varianza = ${d*d}`,`σ = √${d*d} = ${d}`],{traps:{[d*d]:'Esa es la varianza. Falta sacar raíz cuadrada.'}});
 }},
{id:'m3-condicional',eje:'d',title:'Probabilidad condicional',tag:'Sabiendo que algo ocurrió',
 lesson:[
  C('Tabla de doble entrada','P(A | B) se lee “probabilidad de A <b>dado que</b> ocurrió B”. Solo se mira el grupo B.','Curso de 30 estudiantes: ¿hace deporte?',
   [['“Dado que es mujer” → miro solo la fila Mujeres: 15','Dado que es mujer: solo miro la fila de las mujeres. Son quince.'],['De ellas, hacen deporte: 8','De esas quince, ocho hacen deporte.'],[`P(deporte | mujer) = ${F(8,15)}`,'La probabilidad es ocho quinceavos.']],
   ['Con la misma tabla, ¿cuál es P(deporte | hombre)?',[F(6,15),F(6,30),F(6,14)],0,'Miro solo la fila Hombres (15): 6 hacen deporte.'],
   k=>tableVis([['','Deporte','No','Total'],['Mujeres','8','7','15'],['Hombres','6','9','15'],['Total','14','16','30']],k>=1?1:-1,k>=2?[1,1]:null)),
  C('La fórmula','También se calcula con la fórmula <b>P(A | B) = P(A ∩ B) : P(B)</b>.','P(A ∩ B) = 0,2 y P(B) = 0,5',
   [['P(A ∩ B) = 0,2','La probabilidad de que ocurran A y B juntos es cero coma dos.'],['P(B) = 0,5','La probabilidad de B es cero coma cinco.'],['P(A | B) = 0,2 : 0,5 = 0,4','Divido: cero coma dos dividido en cero coma cinco, cero coma cuatro.']],
   ['Si P(A ∩ B) = 0,3 y P(B) = 0,6, ¿cuánto es P(A | B)?',['0,5','0,18','0,9'],0,'0,3 : 0,6 = 0,5.'])],
 gen(l){
  const mt=pick([20,25,50]),ht=pick([20,25,50]),mf=R(2,mt-2),hf=R(2,ht-2),rows=[['','Deporte','No','Total'],['Mujeres',mf,mt-mf,mt],['Hombres',hf,ht-hf,ht],['Total',mf+hf,mt+ht-mf-hf,mt+ht]],fig=tableVis(rows);
  if(l===0){const ans=F(mf,mt);return qc('¿Cuál es P(deporte | mujer)?',ans,optsS(ans,[F(mf,mt+ht),F(mf,mf+hf),F(mt,mt+ht)].filter(x=>x!==ans)),'Mira solo la fila Mujeres.',[`Dado que es mujer: total ${mt}`,`Hacen deporte: ${mf}`,`P = ${ans}`],{fig,traps:{[F(mf,mt+ht)]:'Usaste el total del curso. “Dado que es mujer” significa mirar solo a las mujeres.'}})}
  if(l===1)return qn('¿Cuál es P(deporte | mujer) en decimal?',mf/mt,'Mira solo la fila Mujeres y divide.',[`P = ${F(mf,mt)}`,`= ${N(mf/mt)}`],{fig});
  if(l===2)return qn('¿Cuál es P(no hace deporte | hombre) en decimal?',(ht-hf)/ht,'Mira solo la fila Hombres.',[`Hombres: ${ht}; no hacen deporte: ${ht-hf}`,`P = ${F(ht-hf,ht)} = ${N((ht-hf)/ht)}`],{fig});
  if(l===3){const ans=F(mf,mf+hf);return qc('¿Cuál es P(mujer | hace deporte)?',ans,optsS(ans,[F(mf,mt),F(mf,mt+ht),F(hf,mf+hf)].filter(x=>x!==ans)),'Ahora el grupo es la columna Deporte.',[`Dado que hace deporte: total ${mf+hf}`,`De ellos, mujeres: ${mf}`,`P = ${ans}`],{fig})}
  const [pab,pb,v]=pick([[0.2,0.5,0.4],[0.12,0.4,0.3],[0.3,0.6,0.5],[0.15,0.5,0.3],[0.24,0.8,0.3],[0.18,0.6,0.3]]);return qn(`Si P(A ∩ B) = ${N(pab)} y P(B) = ${N(pb)}, ¿cuánto es P(A | B)?`,v,'P(A | B) = P(A ∩ B) : P(B).',[`P(A | B) = ${N(pab)} : ${N(pb)}`,`= ${N(v)}`],{traps:{[r2(pab*pb)]:'Multiplicaste. La fórmula es dividir P(A ∩ B) por P(B).'}});
 }},
{id:'m3-exponencial',eje:'a',title:'Función exponencial',tag:'Crecer y decrecer en porcentaje',
 lesson:[
  C('Duplicar una y otra vez','Si algo se <b>multiplica por el mismo número</b> en cada período, crece de forma exponencial.','100 bacterias que se duplican cada hora',
   [['Hora 0: 100','Al comienzo hay cien bacterias.'],['Hora 1: 100 · 2 = 200','Después de una hora se duplican: doscientas.'],['Hora 2: 200 · 2 = 400','Después de dos horas: cuatrocientas.'],['Hora 3: 400 · 2 = 800','Después de tres horas: ochocientas.'],['f(t) = 100 · 2ᵗ','La función es cien por dos elevado a t, donde t son las horas.']],
   ['Con f(t) = 100 · 2ᵗ, ¿cuántas bacterias hay a las 4 horas?',['1.600','800','900'],0,'100 · 2⁴ = 100 · 16 = 1.600.'],
   k=>chipsRow([100,200,400,800].map((v,i)=>({t:N(v),c:i<k?(i===k-1?'hl':''):'off'})))),
  C('Crecimiento porcentual','Crecer un 10% cada año es <b>multiplicar por 1,1</b> cada año.','$100.000 que crecen 10% al año',
   [['Crecer 10% → multiplicar por 1,1','Crecer un diez por ciento es lo mismo que multiplicar por uno coma uno.'],['Año 1: 100.000 · 1,1 = 110.000','Primer año: ciento diez mil.'],['Año 2: 110.000 · 1,1 = 121.000','Segundo año: ciento veintiún mil. Creció más que el primer año.'],['f(t) = 100.000 · 1,1ᵗ','La función es cien mil por uno coma uno elevado a t.']],
   ['Si algo disminuye 20% cada año, ¿por cuánto se multiplica?',['0,8','1,2','0,2'],0,'Si pierde 20%, queda el 80%: multiplicar por 0,8.'])],
 gen(l){
  if(l===0){const a=pick([50,100,200]),h=R(2,4),v=a*2**h;return qc(`Hay ${a} bacterias y se duplican cada hora. ¿Cuántas hay después de ${h} horas?`,v,opts(v,[a*2*h,a+2*h,v/2]),'Multiplica por 2 una vez por cada hora.',[`${a} · 2${sup(h)}`,`= ${a} · ${2**h} = ${N(v)}`],{traps:{[a*2*h]:`No es ${a} · 2 · ${h}: se multiplica por 2 en cada hora, ${h} veces.`}})}
  if(l===1){const a=pick([800,400,160,320]),n=R(2,3),v=a/2**n;return qn(`Un medicamento se reduce a la mitad cada 6 horas. Si hay ${a} mg, ¿cuánto queda después de ${6*n} horas?`,v,`Cuenta cuántas veces pasan 6 horas y divide por 2 esas veces.`,[`${6*n} horas = ${n} períodos de 6 horas`,`${a} · ${F(1,'2'+sup(n))} = ${a} : ${2**n}`,`= ${N(v)} mg`],{unit:'mg'})}
  if(l===2){const p=pick([5,8,10,20,25]),up=R(0,1)===1,ans=N(up?1+p/100:1-p/100);return qc(`Si algo ${up?'aumenta':'disminuye'} ${p}% cada año, ¿por cuánto se multiplica cada año?`,ans,optsS(ans,[N(p/100),N(up?1-p/100:1+p/100),N(1+p/10)].filter(x=>x!==ans)),up?'Al 100% súmale el aumento.':'Al 100% réstale la disminución.',[`${up?'100% + '+p+'%':'100% − '+p+'%'} = ${up?100+p:100-p}%`,`= ${ans}`])}
  if(l===3){const C0=pick([10000,50000,100000]),p=pick([10,20]),v=C0*(100+p)*(100+p)/10000;return qn(`Ahorras ${M(C0)} y crecen ${p}% cada año (interés compuesto). ¿Cuánto tienes después de 2 años?`,v,`Multiplica por ${N(1+p/100)} dos veces.`,[`Año 1: ${N(C0)} · ${N(1+p/100)} = ${N(C0*(100+p)/100)}`,`Año 2: ${N(C0*(100+p)/100)} · ${N(1+p/100)} = ${M(v)}`],{unit:'$',traps:{[C0*(100+2*p)/100]:'Eso es crecer siempre sobre el monto inicial. Aquí el segundo año crece sobre lo acumulado.'}})}
  const C0=pick([5000000,8000000,10000000]),p=pick([10,20]),v=C0*(100-p)*(100-p)/10000;return qn(`Un auto de ${M(C0)} pierde ${p}% de su valor cada año. ¿Cuánto vale después de 2 años?`,v,`Multiplica por ${N(1-p/100)} dos veces.`,[`Año 1: ${N(C0)} · ${N(1-p/100)} = ${N(C0*(100-p)/100)}`,`Año 2: ${N(C0*(100-p)/100)} · ${N(1-p/100)} = ${M(v)}`],{unit:'$'});
 }},
{id:'m3-circunf',eje:'g',title:'Distancia y circunferencia',tag:'Geometría en el plano cartesiano',
 lesson:[
  C('Distancia entre dos puntos','La distancia entre dos puntos sale del <b>teorema de Pitágoras</b>: d = √(Δx² + Δy²).','A(1, 2) y B(4, 6)',
   [['Δx = 4 − 1 = 3','La diferencia horizontal: cuatro menos uno, tres.'],['Δy = 6 − 2 = 4','La diferencia vertical: seis menos dos, cuatro.'],['d = √(3² + 4²) = √25 = 5','Es un triángulo rectángulo: raíz de tres al cuadrado más cuatro al cuadrado, raíz de veinticinco, cinco.']],
   ['¿Cuál es la distancia entre (0, 0) y (6, 8)?',['10','14','100'],0,'√(6² + 8²) = √100 = 10.'],
   k=>coordVis(k)),
  C('Ecuación de la circunferencia','Todos los puntos de una circunferencia están a la <b>misma distancia</b> del centro: el radio.','Centro (0, 0) y radio 5',
   [['Cada punto (x, y) está a distancia 5 del centro','Cada punto equis, y de la circunferencia está a distancia cinco del centro.'],['√(x² + y²) = 5','Usando la distancia: raíz de equis al cuadrado más y al cuadrado igual a cinco.'],['x² + y² = 25','Elevo al cuadrado: equis al cuadrado más y al cuadrado igual a veinticinco.'],['Con centro (h, k): (x − h)² + (y − k)² = r²','Si el centro es h, k, la ecuación es equis menos h al cuadrado, más y menos k al cuadrado, igual a r al cuadrado.']],
   ['Centro (0, 0), radio 3. ¿Cuál es la ecuación?',['x² + y² = 9','x² + y² = 3','x + y = 9'],0,'El radio va al cuadrado: 3² = 9.'])],
 gen(l){
  if(l===0){const x1=R(-5,3),y=R(-4,5),d=R(2,9);return qn(`¿Cuál es la distancia entre (${x1}, ${y}) y (${x1+d}, ${y})?`.replace(/-/g,'−'),d,'Están a la misma altura: resta las coordenadas x.',[`Δx = ${N(x1+d)} − ${P(x1)} = ${d}`,`Δy = 0`,`d = ${d}`])}
  if(l===1){const [a,b,c]=pick([[3,4,5],[6,8,10],[5,12,13],[8,6,10]]),x1=R(-4,3),y1=R(-4,3);return qn(`¿Cuál es la distancia entre (${N(x1)}, ${N(y1)}) y (${N(x1+a)}, ${N(y1+b)})?`,c,'d = √(Δx² + Δy²).',[`Δx = ${a}; Δy = ${b}`,`d = √(${a*a} + ${b*b}) = √${c*c}`,`d = ${c}`],{traps:{[a+b]:'No se suman las diferencias: es Pitágoras.',[c*c]:'Te faltó sacar la raíz.'}})}
  if(l===2){const r=R(2,12);return qn(`La circunferencia x² + y² = ${r*r}, ¿qué radio tiene?`,r,'El número de la derecha es el radio al cuadrado.',[`r² = ${r*r}`,`r = √${r*r} = ${r}`],{traps:{[r*r]:'Ese es r². Falta sacar raíz.'}})}
  if(l===3){const h=nz(-5,5),k=nz(-5,5),r=R(2,6),ans=circEq(h,k,r*r);return qc(`¿Cuál es la ecuación de la circunferencia de centro (${N(h)}, ${N(k)}) y radio ${r}?`,ans,optsS(ans,[circEq(h,k,r),circEq(-h,-k,r*r),circEq(k,h,r*r)].filter(x=>x!==ans)),'(x − h)² + (y − k)² = r². Cuidado con los signos.',[`h = ${N(h)}, k = ${N(k)}, r² = ${r*r}`,ans],{traps:{[circEq(h,k,r)]:'El radio va al cuadrado.',[circEq(-h,-k,r*r)]:'Revisa los signos: con centro (h, k) se escribe (x − h) y (y − k).'}})}
  const [x,y,on]=pick([[3,4,1],[4,3,1],[5,0,1],[0,5,1],[2,4,0],[4,4,0],[1,5,0]]);return qc(`¿El punto (${x}, ${y}) está sobre la circunferencia x² + y² = 25?`,on?'Sí':'No',['Sí','No'],'Reemplaza x e y en la ecuación.',[`${x}² + ${y}² = ${x*x} + ${y*y} = ${x*x+y*y}`,on?'Da 25: sí está':'No da 25: no está']);
 }}]};

const M4={id:'m4',name:'4° medio',topics:[
{id:'m4-interes',eje:'n',title:'Interés simple y compuesto',tag:'Ahorros y créditos',
 lesson:[
  C('Interés simple','En el interés simple, cada año se gana el <b>mismo interés</b>, calculado sobre el monto inicial.','$100.000 al 5% anual durante 3 años',
   [['Interés de 1 año: 5% de 100.000 = 5.000','Un año de interés: el cinco por ciento de cien mil, cinco mil pesos.'],['En 3 años: 5.000 · 3 = 15.000','En tres años: cinco mil por tres, quince mil.'],['Total: 100.000 + 15.000 = $115.000','Al final tengo ciento quince mil pesos.']],
   ['$200.000 al 10% anual simple, ¿cuánto interés en 2 años?',['$40.000','$20.000','$42.000'],0,'10% de 200.000 = 20.000 por año. En 2 años: 40.000.']),
  C('Interés compuesto','En el interés compuesto, el interés de cada año se suma al ahorro y <b>también gana interés</b>.','$100.000 al 10% anual durante 2 años',
   [['Año 1: 100.000 · 1,1 = 110.000','Primer año: cien mil por uno coma uno, ciento diez mil.'],['Año 2: 110.000 · 1,1 = 121.000','Segundo año: ahora el diez por ciento se calcula sobre ciento diez mil. Da ciento veintiún mil.'],['Fórmula: C · (1 + i)ⁿ','La fórmula es el capital por uno más la tasa, elevado al número de años.'],['El interés gana interés','Con interés compuesto se gana más que con interés simple: el interés también gana interés.']],
   ['A igual tasa y tiempo, ¿con cuál se gana más?',['Compuesto','Simple','Igual'],0,'En el compuesto el interés de cada año también genera interés.'],
   k=>tableVis([['Año','Simple','Compuesto'],['0','100.000','100.000'],['1','110.000',k>=1?'110.000':'?'],['2','120.000',k>=2?'121.000':'?']],k>=2?3:-1))],
 gen(l){
  const C0=pick([100000,200000,500000,1000000]),i=pick([3,4,5,6,10]);
  if(l===0){const v=C0*i/100;return qc(`Depositas ${M(C0)} al ${i}% anual. ¿Cuánto interés ganas en 1 año?`,v,opts(v,[C0+v,v*10,v/10]),`Calcula el ${i}% de ${N(C0)}.`,[`${i}% de ${N(C0)} = ${N(C0)} · ${i} : 100`,`= ${M(v)}`],{unit:'$',traps:{[C0+v]:'Ese es el total. La pregunta es solo por el interés.'}})}
  if(l===1){const n=R(2,5),I=C0*i/100,v=C0+I*n;return qn(`Depositas ${M(C0)} al ${i}% anual de interés simple. ¿Cuánto tienes después de ${n} años?`,v,'Calcula el interés de un año, multiplícalo por los años y súmalo al depósito.',[`Interés anual: ${M(I)}`,`${n} años: ${N(I)} · ${n} = ${N(I*n)}`,`Total: ${N(C0)} + ${N(I*n)} = ${M(v)}`],{unit:'$',traps:{[I*n]:'Ese es solo el interés. Falta sumar el depósito inicial.'}})}
  if(l<4){const p=l===2?10:pick([5,20]),v=C0*(100+p)*(100+p)/10000;return qn(`Depositas ${M(C0)} al ${p}% anual de interés compuesto. ¿Cuánto tienes después de 2 años?`,v,`Multiplica por ${N(1+p/100)} dos veces.`,[`Año 1: ${N(C0)} · ${N(1+p/100)} = ${N(C0*(100+p)/100)}`,`Año 2: ${N(C0*(100+p)/100)} · ${N(1+p/100)} = ${M(v)}`],{unit:'$',traps:{[C0*(100+2*p)/100]:'Ese es el resultado con interés simple. En el compuesto, el segundo año se calcula sobre lo acumulado.'}})}
  const v=C0/100;return qn(`Depositas ${M(C0)} por 2 años al 10% anual. ¿Cuánto más ganas con interés compuesto que con interés simple?`,v,'Calcula los dos totales y réstalos.',[`Simple: ${N(C0)} + 2 · ${N(C0/10)} = ${N(C0*1.2)}`,`Compuesto: ${N(C0)} · 1,1 · 1,1 = ${N(C0*1.21)}`,`Diferencia: ${M(v)}`],{unit:'$'});
 }},
{id:'m4-binomial',eje:'d',title:'Distribución binomial',tag:'Éxitos en varios intentos',
 lesson:[
  C('Lanzar 3 monedas','Cuando repites un experimento con dos resultados posibles, puedes <b>contar</b> todas las combinaciones.','¿P(exactamente 2 caras) al lanzar 3 monedas?',
   [['Total de resultados: 2³ = 8','Cada moneda tiene dos resultados. Con tres monedas: dos al cubo, ocho resultados.'],['Con 2 caras: CCS, CSC, SCC → 3','Los que tienen exactamente dos caras son tres.'],[`P = ${F(3,8)}`,'La probabilidad es tres octavos.']],
   ['¿Cuántos resultados hay al lanzar 4 monedas?',['16','8','4'],0,'2⁴ = 16.'],
   k=>chipsRow(['CCC','CCS','CSC','SCC','CSS','SCS','SSC','SSS'].map(v=>({t:v,c:k>=2&&['CCS','CSC','SCC'].includes(v)?'hl':k>=1?'':'off'})))),
  C('Intentos independientes','Si los intentos son independientes, la probabilidad de que <b>todos</b> resulten se calcula <b>multiplicando</b>.','Dos tiros libres con 70% de acierto',
   [['P(acertar los 2) = 0,7 · 0,7 = 0,49','Acertar los dos: cero coma siete por cero coma siete, cero coma cuarenta y nueve.'],['P(fallar los 2) = 0,3 · 0,3 = 0,09','Fallar los dos: cero coma tres por cero coma tres, cero coma cero nueve.'],['P(acertar 1) = 1 − 0,49 − 0,09 = 0,42','Acertar exactamente uno: uno menos los otros dos casos, cero coma cuarenta y dos.']],
   ['Si P(acierto) = 0,5, ¿cuál es P(acertar 2 de 2)?',['0,25','0,5','1'],0,'0,5 · 0,5 = 0,25.'])],
 gen(l){
  if(l===0){const n=R(2,6);return qc(`¿Cuántos resultados posibles hay al lanzar ${n} monedas?`,2**n,opts(2**n,[2*n,n,2**n/2]),'Cada moneda duplica los resultados.',[`2${sup(n)} = ${2**n}`],{traps:{[2*n]:`No es 2 · ${n}: es 2 elevado a ${n}.`}})}
  if(l===1){const n=R(2,4),ans=F(1,2**n);return qc(`Lanzas ${n} monedas. ¿Cuál es la probabilidad de que todas sean cara?`,ans,optsS(ans,[F(1,n),F(n,2**n),F(1,2*n)].filter(x=>x!==ans)),'Solo hay un resultado con todas caras.',[`Resultados posibles: 2${sup(n)} = ${2**n}`,'Favorables: 1',`P = ${ans}`])}
  if(l===2){const k=R(0,3),c=[1,3,3,1][k],ans=FS(c,8);return qc(`Lanzas 3 monedas. ¿Cuál es la probabilidad de obtener exactamente ${k} ${k===1?'cara':'caras'}?`,ans,optsS(ans,[F(1,8),F(3,8),F(k||1,3),F(1,2)].filter(x=>x!==ans)),'Escribe los 8 resultados y cuenta.',['Resultados posibles: 8',`Con exactamente ${k} ${k===1?'cara':'caras'}: ${c}`,`P = ${ans}`])}
  if(l===3){const p=pick([0.5,0.4,0.2,0.8,0.3,0.6,0.9]);return qn(`Un jugador acierta un penal con probabilidad ${N(p)}. Si lanza dos penales, ¿cuál es la probabilidad de acertar ambos?`,r2(p*p),'Los lanzamientos son independientes: multiplica.',[`P = ${N(p)} · ${N(p)}`,`= ${N(r2(p*p))}`],{traps:{[r2(2*p)]:'Sumaste. Para que ocurran los dos, se multiplica.'}})}
  const v=pick([['moneda','cara',2,[10,20,50,100]],['dado','seis',6,[30,60,120]]]),n=pick(v[3]);return qn(`Si lanzas un${v[0]==='moneda'?'a':''} ${v[0]} ${n} veces, ¿cuántas veces esperas obtener ${v[1]}?`,n/v[2],'Valor esperado = cantidad de intentos · probabilidad.',[`P(${v[1]}) = ${F(1,v[2])}`,`${n} · ${F(1,v[2])} = ${n/v[2]}`]);
 }},
{id:'m4-volumen',eje:'g',title:'Volumen de cuerpos',tag:'Cilindro, cono y esfera',
 lesson:[
  C('Volumen del cilindro','El volumen de un cilindro es el <b>área de la base por la altura</b>. Usamos π ≈ 3,14.','Radio 2 cm, altura 5 cm',

   ['Si duplicas la altura de un cilindro, el volumen…',['se duplica','se cuadruplica','no cambia'],0,'La altura multiplica directamente: el doble de altura es el doble de volumen.'],

   [['V cono = π · r² · h : 3','El volumen del cono es pi por radio al cuadrado por altura, dividido en tres.'],['3,14 · 9 · 4 = 113,04','Pi por nueve por cuatro: ciento trece coma cero cuatro.'],['113,04 : 3 = 37,68 cm³','Divido en tres: treinta y siete coma sesenta y ocho centímetros cúbicos.'],[`Esfera: V = ${F(4,3)} · π · r³`,'Para la esfera: cuatro tercios por pi por el radio al cubo.']],
   ['¿Qué fracción del cilindro es un cono de igual base y altura?',[F(1,3),F(1,2),F(2,3)],0,'El cono ocupa un tercio del cilindro.'])],
 gen(l){

  if(l===2){let r,h;do{r=R(1,6);h=R(2,12)}while((r*r*h)%3);const v=r2(3.14*r*r*h/3);return qn(`¿Cuál es el volumen de un cono de radio ${r} cm y altura ${h} cm? (π ≈ 3,14)`,v,'Como el cilindro, pero dividido en 3.',[`3,14 · ${r*r} · ${h} = ${N(r2(3.14*r*r*h))}`,`: 3 = ${N(v)} cm³`],{unit:'cm³',traps:{[r2(3.14*r*r*h)]:'Ese es el volumen del cilindro. El cono es un tercio.'}})}

  const r=pick([3,6]),v=r2(4/3*3.14*r**3);return qn(`¿Cuál es el volumen de una esfera de radio ${r} cm? (π ≈ 3,14)`,v,`V = ${F(4,3)} · π · r³.`,[`r³ = ${r}³ = ${r**3}`,`${F(4,3)} · 3,14 · ${r**3} = ${N(v)} cm³`],{unit:'cm³'});

async function hashPw(pw,salt){
  try{if(window.crypto&&crypto.subtle){const enc=new TextEncoder(),k=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:120000,hash:'SHA-256'},k,256);return 'p2$'+hex(bits)}}catch(e){}
  let h=2166136261>>>0;const s=salt+':'+pw;for(let r=0;r<3000;r++)for(let i=0;i<s.length;i++){h^=s.charCodeAt(i)+r;h=Math.imul(h,16777619)>>>0}return 'f1$'+h.toString(16);
}

   <li><b>Coordinen con el colegio.</b> El profesor o profesora jefe y el equipo PIE pueden indicar qué temas reforzar.</li>
  </ul>
  <p class="small">Este es un material de práctica. No reemplaza la evaluación ni el acompañamiento de profesionales de la salud o de la educación.</p></details>`:''}
  <p class="foot">Temas seleccionados de los ejes de las Bases Curriculares de Matemática para cada curso. No cubre todo el programa: revisa con el profesor o la profesora qué temas están viendo.</p>`;
}
function lesson(){
  const L=S.mod.lesson,c=L[S.li],last=S.li===L.length-1;
  return `<div class="bar"><button class="ghost" type="button" data-act="home">← Inicio</button><button class="link" type="button" data-act="quiz">Saltar a la misión</button></div>
  <section class="card"><p class="eyebrow">${S.mod.g.name} · ${S.mod.title} · Mini lección ${S.li+1} de ${L.length}</p><h2>${c.h}</h2><p class="intro" id="intro">${c.p}</p>
  <div id="ex">${exHtml()}</div>
  <div class="row"><button class="btn" type="button" data-act="prev" ${S.li?'':'disabled'}>← Atrás</button><button class="btn ${LP.k>=c.steps.length?'primary':''} end" type="button" id="lnextCard" data-act="${last?'quiz':'next'}">${last?'Empezar la misión':'Siguiente tema →'}</button></div></section>`;
}
function exHtml(){
  const c=S.mod.lesson[S.li],st=c.steps,len=st.length,k=LP.k,v=c.vis?c.vis(k):'';
  const playLbl=LP.playing?PAUSE+' Pausar':PLAY+(k===0?(voiceOn()?' Escuchar paso a paso':' Ver paso a paso'):k>=len?' Desde el inicio':' Continuar');
  let h=`<div class="player"><div class="exhead"><span class="eyebrow">Ejemplo</span><span class="exprog">${k?`Paso ${k} de ${len}`:`${len} pasos`}</span></div>
  <div class="extitle paper">${c.exT}</div>${v?`<div class="vis">${v}</div>`:''}
  <ol class="steps paper">${st.slice(0,k).map((s,i)=>`<li class="${i===k-1?'cur':''}"><span>${s.t}</span></li>`).join('')}</ol>
  ${k<len?`<p class="pending">${k===0?'Presiona el botón para que la voz te explique, o avanza tú con “Siguiente paso”.':`Quedan ${len-k} ${len-k===1?'paso':'pasos'}.`}</p>`:''}
  <div class="pctl"><button class="btn primary" type="button" data-act="lplay">${playLbl}</button>
  <button class="btn" type="button" data-act="lnext" ${k>=len?'disabled':''}>Siguiente paso →</button>
  ${k>0&&!LP.playing?'<button class="btn" type="button" data-act="lrep">Repetir paso</button>':''}
  ${k<len&&!LP.playing?'<button class="ghost" type="button" data-act="lall">Ver todo</button>':''}</div></div>`;
  if(k>=len&&c.try){const t=c.try,dn=LP.tried!==null;
    h+=`<div class="try"><p class="eyebrow">Tu turno</p><div class="fbrow"><p class="tq">${t.q}</p>${sayBtn(toSpeech(t.q+'. Las opciones son: '+t.o.join(', ')),'Escuchar la pregunta')}</div>
    <div class="topts">${t.o.map((o,i)=>{let cl='opt sm';if(dn&&i===t.a)cl+=' right';else if(dn&&i===LP.tried)cl+=' wrong';return `<button type="button" class="${cl}" data-act="try" data-i="${i}" ${dn?'disabled':''}><span>${o}</span></button>`}).join('')}</div>
    ${dn?`<div class="fb ${LP.tried===t.a?'ok':'sol'}"><span><b>${LP.tried===t.a?LP.tryMsg:'Esta vez no. La correcta está marcada en verde.'}</b> ${t.why}</span></div>`:''}</div>`;
  }
  return h;
}
function updEx(){const e=$('#ex');if(e)e.innerHTML=exHtml();const i=$('#intro');if(i)i.classList.toggle('speaking',LP.intro);
  const nb=$('#lnextCard'),c=S.mod.lesson[S.li];if(nb)nb.classList.toggle('primary',LP.k>=c.steps.length);
  const cur=$('#ex .steps li.cur');if(cur)cur.scrollIntoView({block:'nearest',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})}
function resetLP(){LP.k=0;LP.playing=false;LP.intro=false;LP.tried=null}
function lplay(){
  if(LP.playing){stopVoice();LP.playing=false;LP.intro=false;updEx();return}
  const c=S.mod.lesson[S.li],st=c.steps;if(LP.k>=st.length){LP.k=0;LP.tried=null}
  const items=[],map=[];if(LP.k===0){items.push(toSpeech(c.p));map.push(0)}
  for(let j=LP.k;j<st.length;j++){items.push(stepSay(st[j]));map.push(j+1)}
  seq(items,i=>{LP.playing=true;LP.k=Math.max(LP.k,map[i]);LP.intro=map[i]===0;updEx()},()=>{LP.playing=false;LP.intro=false;updEx();if(c.try&&voiceOn())setTimeout(()=>{if(!LP.playing&&LP.tried===null&&S.view==='lesson')seq(['Ahora es tu turno. '+toSpeech(c.try.q)])},300)});
  LP.playing=true;updEx();
}
function lstep(){const c=S.mod.lesson[S.li];stopVoice();LP.playing=false;LP.intro=false;if(LP.k<c.steps.length)LP.k++;updEx();if(voiceOn())seq([stepSay(c.steps[LP.k-1])])}

function quiz(){
  const q=S.qs[S.qi];
  const dots=S.qs.map((_,i)=>`<span class="dot${i<S.qi?' past':''}${i===S.qi?' now':''}"></span>`).join('');
  let area;
  if(q.type==='choice'){
    const long=q.options.some(o=>typeof o==='string'&&o.replace(/<[^>]+>/g,'').length>14);
    area=`<div class="opts">${q.options.map((o,i)=>{let c='opt'+(long?' long':'');if(S.done&&o===q.answer)c+=' right';if(S.dis.includes(i))c+=' wrong';return `<button type="button" class="${c}" data-act="pick" data-i="${i}" ${S.done||S.dis.includes(i)?'disabled':''}><span class="k" aria-hidden="true">${i+1}</span><span>${disp(q,o)}</span></button>`}).join('')}</div>`;
  }else{
    area=`<form class="ans" id="ansForm" autocomplete="off"><label class="sr" for="ansIn">Tu respuesta</label>${q.unit==='$'?'<span class="unit">$</span>':''}<input id="ansIn" inputmode="decimal" placeholder="Tu respuesta" ${S.done?'disabled':''} value="${S.done?esc(S.last):''}">${q.unit&&q.unit!=='$'?`<span class="unit">${q.unit}</span>`:''}<button type="button" class="btn sign" data-act="sign" aria-label="Cambiar signo (positivo o negativo)" ${S.done?'disabled':''}>±</button></form>`;
  }
  const stepsOl=`<ol id="solSteps">${q.steps.map(s=>`<li>${s}</li>`).join('')}</ol>`;
  const solBtn=`<button class="btn small" type="button" data-act="solv">${PLAY} Escuchar la explicación</button>`;
  let fb='';
  if(S.fb){
    if(S.fb.k==='ok')fb=`<div class="fb ok"><span class="big-ok">${S.fb.m}</span><details><summary>Ver cómo se resuelve</summary>${stepsOl}${solBtn}</details></div>`;
    else if(S.fb.k==='retry')fb=`<div class="fb bad"><div class="fbrow"><span><b>Casi.</b> ${S.fb.m||'Respira, lee la pista y prueba otra vez.'}</span>${sayBtn(toSpeech('Casi. '+(S.fb.m||'Respira, lee la pista y prueba otra vez.')))}</div></div>`;
    else if(S.fb.k==='empty')fb=`<div class="fb bad"><span>Escribe un número antes de comprobar.</span></div>`;
    else fb=`<div class="fb sol"><b>Esta vez no salió. Así se resuelve:</b>${stepsOl}<span>Respuesta: <b>${disp(q,q.answer)}</b></span><div>${solBtn}</div></div>`;
  }
  const last=S.qi===S.qs.length-1;
  const ctr=S.done
    ?`<button class="btn primary end" type="button" id="nextBtn" data-act="nextq">${last?'Ver mi resultado':'Siguiente pregunta →'}</button>`
    :`${S.hint?'':'<button class="btn" type="button" data-act="hint">Ver pista</button>'}${q.type==='num'?'<button class="btn primary end" type="button" data-act="check">Comprobar</button>':''}`;
  return `<div class="bar"><button class="ghost" type="button" data-act="home">← Salir</button><div class="dots" role="img" aria-label="Pregunta ${S.qi+1} de ${S.qs.length}">${dots}</div></div>
  <section class="card"><p class="eyebrow">${S.mod.g.name} · ${S.mod.title} · Pregunta ${S.qi+1} de ${S.qs.length}</p>
  <div class="qhead"><h2>${q.prompt}</h2>${sayBtn(qSpeechOf(q),'Escuchar la pregunta')}</div>
  ${q.expr?`<div class="expr paper">${q.expr}</div>`:''}${q.fig?`<div class="qfig">${q.fig}</div>`:''}${q.note?`<p class="note">${q.note}</p>`:''}
  ${area}
  ${S.hint&&!S.done?`<div class="hintbox"><span><b>Pista:</b> ${q.hint}</span>${sayBtn(toSpeech('Pista. '+q.hint),'Escuchar la pista')}</div>`:''}
  <div id="fb" aria-live="polite">${fb}</div>
  <div class="row">${ctr}</div></section>`;
}
function done(){
  const n=S.stars;
  const msg=['Terminaste la misión. Eso ya es un logro.','Buen esfuerzo. Practicar es lo que más ayuda.','¡Muy bien! Vas avanzando.','¡Misión cumplida con todo!'][n];
  const tip=n<2?'Te recomiendo volver a escuchar los ejemplos de la lección y probar otra vez. Las preguntas cambian cada vez.':n<3?'Una misión más del mismo tema y vas por las tres estrellas.':'Puedes probar otro tema o subir tu puntaje en otra misión.';
  return `<section class="card done"><p class="eyebrow">${S.mod.g.name} · ${S.mod.title} · Misión completa</p><h2>${msg}</h2>${stars(n,true)}
  <p class="lead">Lograste <b>${sc(S.score)}</b> de 5 y ganaste <b>${S.gained}</b> puntos.</p><p>${tip}</p>
  <div class="row"><button class="btn primary" type="button" data-act="break">Pausa activa (1 min)</button><button class="btn" type="button" data-act="quiz">Otra misión de este tema</button><button class="btn" type="button" data-act="relesson">Repasar la lección</button><button class="ghost" type="button" data-act="home">Elegir otro tema</button></div></section>`;
}

function csvOut(){

}

function openMenu(){const m=$('#amenu');m.innerHTML=`<div class="who"><b>${esc(U.name)}</b><small>${esc(U.user)} · ${U.role==='admin'?'Administrador':'Estudiante'}</small></div>${U.role==='admin'?'<button class="mi" type="button" data-m="panel">Panel de control</button><button class="mi" type="button" data-m="mypw">Cambiar mi clave</button>':''}<button class="mi" type="button" data-m="home">Ir al inicio</button><button class="mi" type="button" data-m="logout">Cerrar sesión</button>`;m.hidden=false;$('#acct').setAttribute('aria-expanded','true');const f=m.querySelector('.mi');if(f)f.focus()}
function closeMenu(){const m=$('#amenu');if(m)m.hidden=true;const a=$('#acct');if(a)a.setAttribute('aria-expanded','false')}
$('#acct').addEventListener('click',e=>{e.stopPropagation();$('#amenu').hidden?openMenu():closeMenu()});
$('#amenu').addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(!b)return;const m=b.dataset.m;closeMenu();
  if(m==='logout'){stopT();U=null;sess.set(null);S.view='home';S.form={};S.msg={ok:true,t:'Cerraste sesión.'};render();S.msg=null}
  else if(m==='panel'){S.view='panel';S.pv='list';S.msg=null;render()}
  else if(m==='mypw'){S.view='mypw';S.form={};S.msg=null;render()}
  else{S.view='home';render()}});
document.addEventListener('click',e=>{if(!e.target.closest('#amenu')&&!e.target.closest('#acct'))closeMenu()});

/* ================= lógica de la misión ================= */
function resetQ(){S.tries=0;S.done=false;S.fb=null;S.hint=false;S.dis=[];S.last=''}
function startQuiz(){S.qs=[0,1,2,3,4].map(l=>S.mod.gen(l));S.qi=0;S.score=0;S.gained=0;resetQ();S.view='quiz';prevView=null;render()}
function check(v){
  const q=S.qs[S.qi];let ok,val;
  if(q.type==='choice'){val=q.options[v];ok=val===q.answer}
  else{val=parseNum(v);if(!Number.isFinite(val)){S.fb={k:'empty'};render();return}ok=Math.abs(val-q.answer)<1e-6;S.last=v}
  if(ok){const pts=S.tries?5:10;S.score+=S.tries?0.5:1;S.gained+=pts;U.xp+=pts;save();S.fb={k:'ok',m:pick(OK)};S.done=true}
  else{S.tries++;if(q.type==='choice')S.dis.push(+v);
    if(S.tries>=2||(q.type==='choice'&&q.options.length-S.dis.length<=1)){S.fb={k:'sol'};S.done=true}
    else{const key=typeof val==='number'?String(r2(val)):String(val),tm=q.traps&&(q.traps[key]||q.traps[String(val)]);S.fb={k:'retry',m:tm?tm+' Prueba otra vez.':''};S.hint=true}}
  render();
  const f=$('#fb .fb');if(f)f.scrollIntoView({block:'nearest',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
  if(voiceOn()&&S.fb){if(S.fb.k==='ok')seq([S.fb.m]);else if(S.fb.k==='retry')seq([toSpeech('Casi. '+(S.fb.m||'Lee la pista y prueba otra vez.'))])}
}
function finish(){
  const s=S.score;S.stars=s>=4.5?3:s>=3?2:s>=1.5?1:0;
  const r=U.mods[S.mod.id]||{stars:0,best:0,plays:0};r.stars=Math.max(r.stars,S.stars);r.best=Math.max(r.best,s);r.plays++;U.mods[S.mod.id]=r;
  U.hist=(U.hist||[]).concat([{t:S.mod.id,g:S.mod.g.id,s,d:Date.now()}]).slice(-300);U.last=Date.now();save();
  S.view='done';render();
}
function playSol(){
  const q=S.qs[S.qi],lis=[...document.querySelectorAll('#solSteps li')];const d=$('#fb details');if(d)d.open=true;
  const list=q.steps.map(toSpeech);if(S.fb&&S.fb.k==='sol')list.push('La respuesta es '+toSpeech(disp(q,q.answer))+'.');
  seq(list,i=>{lis.forEach((l,j)=>l.classList.toggle('cur',j===i))},()=>lis.forEach(l=>l.classList.remove('cur')));
}

/* ================= formularios ================= */
const val=id=>{const e=$('#'+id);return e?e.value:''};
function keepForm(ids){ids.forEach(id=>{const e=$('#'+id);if(e)S.form[id]=e.type==='checkbox'?e.checked:e.value})}
const fail=(t)=>{S.msg={ok:false,t};render()};
async function onSubmit(id){
  if(id==='setupForm'){keepForm(['sn','su','sp','sp2']);const n=S.form.sn.trim(),u=normUser(S.form.su),p=S.form.sp;
    if(!n)return fail('Escribe tu nombre.');if(!validUser(u))return fail('El usuario debe tener entre 3 y 20 letras, números, puntos o guiones, sin espacios.');if(p.length<6)return fail('La clave debe tener al menos 6 caracteres.');if(p!==S.form.sp2)return fail('Las dos claves no coinciden.');
    const nu=await makeUser({name:n,user:u,pw:p,role:'admin',grade:'b8'});nu.last=Date.now();AUTH.users.push(nu);save();U=nu;sess.set(nu.id);S.form={};S.msg=null;S.view='panel';S.pv='list';render();return}
  if(id==='loginForm'){keepForm(['lu','lp']);const key=normUser(S.form.lu),f=FAIL[key]||(FAIL[key]={n:0,until:0});
    if(f.until>Date.now())return fail(`Demasiados intentos. Espera ${Math.ceil((f.until-Date.now())/1000)} segundos.`);
    const u=findUser(key);const okPw=u?(await hashPw(S.form.lp,u.salt))===u.hash:false;
    if(!u||!okPw){f.n++;if(f.n>=5){f.until=Date.now()+30000;f.n=0;setTimeout(()=>{if(!U)render()},30500);S.form.lp='';return fail('Usuario o clave incorrectos. Por seguridad, espera 30 segundos antes de intentar otra vez.')}S.form.lp='';return fail('Usuario o clave incorrectos. Revisa que esté bien escrito.')}
    if(u.blocked){S.form.lp='';return fail('Tu usuario está bloqueado. Habla con el adulto que administra la app.')}
    delete FAIL[key];U=u;u.last=Date.now();save();sess.set(u.id);S.form={};S.msg=null;S.view='home';render();return}
  if(id==='mypwForm'){keepForm(['mp0','mp1','mp2']);if((await hashPw(S.form.mp0,U.salt))!==U.hash)return fail('La clave actual no es correcta.');if(S.form.mp1.length<6)return fail('La clave nueva debe tener al menos 6 caracteres.');if(S.form.mp1!==S.form.mp2)return fail('Las claves nuevas no coinciden.');
    U.salt=newSalt();U.hash=await hashPw(S.form.mp1,U.salt);save();S.form={};S.msg={ok:true,t:'Listo. Tu clave nueva quedó guardada.'};render();S.msg=null;return}
  if(id==='newForm'){keepForm(['nn','nu','ng','nr','np','nleg']);const n=(S.form.nn||'').trim(),u=normUser(S.form.nu),p=S.form.np||'',role=S.form.nr==='admin'?'admin':'est';
    if(!n)return fail('Escribe un nombre o apodo.');if(!validUser(u))return fail('El usuario debe tener entre 3 y 20 letras, números, puntos o guiones, sin espacios ni tildes.');if(findUser(u))return fail(`Ya existe un usuario llamado “${esc(u)}”. Elige otro.`);if(p.length<(role==='admin'?6:4))return fail(role==='admin'?'La clave de un administrador debe tener al menos 6 caracteres.':'La clave debe tener al menos 4 caracteres.');
    const nu=await makeUser({name:n,user:u,pw:p,role,grade:S.form.ng||'b8'});
    if(S.form.nleg&&AUTH.legacy){nu.xp+=AUTH.legacy.xp;Object.entries(AUTH.legacy.mods).forEach(([k,m])=>{nu.mods[k]={stars:m.stars||0,best:m.best||0,plays:m.plays||0}});AUTH.legacy=null}
    AUTH.users.push(nu);save();S.created={name:n,user:u,pw:p};S.form={};S.msg=null;render();return}
  if(id==='editForm'){const u=AUTH.users.find(x=>x.id===S.pu);if(!u)return;const n=val('en').trim();if(!n)return fail('El nombre no puede quedar vacío.');u.name=n;u.grade=val('eg');const lastAdmin=u.role==='admin'&&admins().length<=1;if(!lastAdmin){const r=val('er')==='admin'?'admin':'est';if(u.id===U.id&&r!=='admin')return fail('No puedes quitarte el rol de administrador a ti mismo.');u.role=r}save();S.msg={ok:true,t:'Cambios guardados.'};render();S.msg=null;return}
  if(id==='pwForm'){keepForm(['pp']);const u=AUTH.users.find(x=>x.id===S.pu);if(!u)return;const p=S.form.pp||'';if(p.length<(u.role==='admin'?6:4))return fail(u.role==='admin'?'La clave de un administrador debe tener al menos 6 caracteres.':'La clave debe tener al menos 4 caracteres.');u.salt=newSalt();u.hash=await hashPw(p,u.salt);save();S.form={};S.msg={ok:true,t:`Clave cambiada. La nueva clave de ${esc(u.user)} es <b>${esc(p)}</b>. Anótala: no se vuelve a mostrar.`};render();S.msg=null;return}
  if(id==='ansForm'){const i=$('#ansIn');if(i&&!S.done)check(i.value)}
}
app.addEventListener('submit',e=>{e.preventDefault();onSubmit(e.target.id)});
app.addEventListener('change',e=>{
  if(e.target.id==='gradeSel'){U.grade=e.target.value;save();render()}
  else if(e.target.id==='pg'){S.pg=e.target.value;render()}
});
let pqT;app.addEventListener('input',e=>{if(e.target.id==='pq'){S.pq=e.target.value;clearTimeout(pqT);pqT=setTimeout(()=>{render();const f=$('#pq');if(f){f.focus();f.setSelectionRange(f.value.length,f.value.length)}},250)}});

app.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act;
  if(a==='open'){S.mod=findTopic(b.dataset.id);S.li=0;resetLP();S.view='lesson';render()}
  else if(a==='home'){S.view='home';S.msg=null;render()}
  else if(a==='next'){S.li++;resetLP();render();window.scrollTo(0,0)}
  else if(a==='prev'){S.li=Math.max(0,S.li-1);resetLP();render();window.scrollTo(0,0)}
  else if(a==='relesson'){S.li=0;resetLP();S.view='lesson';render()}
  else if(a==='quiz')startQuiz();
  else if(a==='lplay')lplay();
  else if(a==='lnext')lstep();
  else if(a==='lrep'){const c=S.mod.lesson[S.li];if(LP.k>0)seq([stepSay(c.steps[LP.k-1])])}
  else if(a==='lall'){stopVoice();LP.playing=false;LP.intro=false;LP.k=S.mod.lesson[S.li].steps.length;updEx()}
  else if(a==='try'){const t=S.mod.lesson[S.li].try;LP.tried=+b.dataset.i;LP.tryMsg=pick(OK);updEx();if(voiceOn())seq([toSpeech((LP.tried===t.a?LP.tryMsg+' ':'Esta vez no. ')+t.why)])}
  else if(a==='say'){seq([b.dataset.say])}
  else if(a==='solv')playSol();
  else if(a==='pick'){if(!S.done)check(+b.dataset.i)}
  else if(a==='check'){const i=$('#ansIn');if(i)check(i.value)}
  else if(a==='hint'){S.hint=true;render();if(voiceOn())seq([toSpeech('Pista. '+S.qs[S.qi].hint)])}
  else if(a==='sign'){const i=$('#ansIn');if(i){i.value=/^\s*[-−]/.test(i.value)?i.value.replace(/^\s*[-−]/,''):'-'+i.value;i.focus()}}
  else if(a==='nextq'){if(S.qi<S.qs.length-1){S.qi++;resetQ();render()}else finish()}
  else if(a==='len')setLen(+b.dataset.n);
  else if(a==='rate'){store.rate=+b.dataset.r;save();render();seq(['Así sueno a esta velocidad.'])}
  else if(a==='testv'){if(store.voice===false){store.voice=true;save();drawV()}seq(['Hola. Voy a explicarte cada paso de los ejemplos. ¡Vamos con todo!'])}
  else if(a==='break')openBreak(false);
  else if(a==='tosetup'){S.view='setup';S.form={};S.msg=null;render()}
  else if(a==='tologin'){S.view='home';S.form={};S.msg=null;render()}
  else if(a==='pwshow'){const i=$('#'+b.dataset.for);if(i){i.type=i.type==='password'?'text':'password';i.focus()}}
  /* panel */
  else if(a==='plist'){S.pv='list';S.created=null;S.form={};S.msg=null;S.confirm=null;S.scrollTop=true;render()}
  else if(a==='pnew'){S.pv='new';S.created=null;S.form={np:genPw()};S.msg=null;S.scrollTop=true;render()}
  else if(a==='puser'){S.pv='detail';S.pu=b.dataset.id;S.form={};S.msg=null;S.confirm=null;S.scrollTop=true;render()}
  else if(a==='genpw'){keepForm(['nn','nu','ng','nr','nleg']);S.form.np=genPw();S.msg=null;render()}
  else if(a==='genpw2'){const i=$('#pp');if(i)i.value=genPw()}
  else if(a==='copycred'){const c=S.created,t=`Misión Mate\nUsuario: ${c.user}\nClave: ${c.pw}`;try{await navigator.clipboard.writeText(t);b.textContent='Copiado'}catch(err){b.textContent='No se pudo copiar: anótalo a mano'}}
  else if(a==='pblock'){const u=AUTH.users.find(x=>x.id===S.pu);if(u&&u.id!==U.id){u.blocked=!u.blocked;save();S.msg={ok:true,t:u.blocked?`${esc(u.name)} ya no puede entrar.`:`${esc(u.name)} puede volver a entrar.`};render();S.msg=null}}
  else if(a==='pdel'){S.confirm='del';render()}
  else if(a==='preset'){S.confirm='reset';render()}
  else if(a==='pcancel'){S.confirm=null;render()}
  else if(a==='pdel2'){const u=AUTH.users.find(x=>x.id===S.pu);if(u&&u.id!==U.id&&!(u.role==='admin'&&admins().length<=1)){AUTH.users=AUTH.users.filter(x=>x.id!==u.id);if(u.generic)AUTH.genericRemoved=true;save();S.pv='list';S.confirm=null;S.msg={ok:true,t:`Se eliminó a ${esc(u.name)}.`};render();S.msg=null}}
  else if(a==='preset2'){const u=AUTH.users.find(x=>x.id===S.pu);if(u){u.xp=0;u.mods={};u.hist=[];save();S.confirm=null;S.msg={ok:true,t:'Progreso borrado.'};render();S.msg=null}}
  else if(a==='csv'&&!DL&&STANDALONE){try{const blob=new Blob([csvOut()],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),ln=document.createElement('a');ln.href=url;ln.download='mision-mate-usuarios.csv';document.body.appendChild(ln);ln.click();ln.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);S.msg={ok:true,t:'Archivo descargado. Se abre en Excel o Google Sheets.'}}catch(err){S.msg={ok:false,t:'No se pudo descargar el archivo en este navegador.'}}render();S.msg=null}
  else if(a==='csv'){if(!DL)return;try{await DL.save({filename:'mision-mate-usuarios.csv',data:csvOut()});S.msg={ok:true,t:'Archivo descargado. Se abre en Excel o Google Sheets.'}}catch(err){S.msg=err&&err.code==='declined'?null:{ok:false,t:'No se pudo descargar el archivo en esta vista.'}}render();S.msg=null}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!$('#amenu').hidden){closeMenu();$('#acct').focus();return}
  if(!$('#brk').hidden){if(e.key==='Escape')closeBreak();return}
  if(S.view==='quiz'&&U&&!S.done){const q=S.qs[S.qi];if(q.type==='choice'&&/^[1-4]$/.test(e.key)&&!e.target.closest('input,select')){const i=+e.key-1;if(i<q.options.length&&!S.dis.includes(i))check(i)}}
});

/* ================= botón de voz ================= */
function drawV(){const b=$('#vbtn');const on=voiceOn();b.innerHTML=on?SPK:MUTE;b.classList.toggle('on',on);b.setAttribute('aria-pressed',String(on));b.setAttribute('aria-label',V.ok?(on?'Apagar la voz':'Encender la voz'):'Voz no disponible en este navegador');b.disabled=!V.ok}
$('#vbtn').addEventListener('click',()=>{store.voice=!voiceOn();save();if(!store.voice)stopVoice();drawV();if(S.view==='lesson')updEx();if(S.view==='home')render();if(store.voice)seq(['Voz encendida.'])});

/* ================= temporizador de enfoque ================= */
const T={len:store.len*60,left:store.len*60,run:false,id:null};
const mmss=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
function drawT(){const b=$('#tmr');b.innerHTML=(T.run?PAUSE:PLAY)+'<span><span class="wd">Enfoque </span>'+mmss(T.left)+'</span>';b.classList.toggle('running',T.run);b.setAttribute('aria-label',(T.run?'Pausar':'Iniciar')+' bloque de enfoque, quedan '+mmss(T.left));$('#tprog').style.width=((T.len-T.left)/T.len*100)+'%'}
function stopT(){T.run=false;clearInterval(T.id);if($('#tmr'))drawT()}
function tick(){T.left--;if(T.left<=0){T.run=false;clearInterval(T.id);T.left=T.len;drawT();openBreak(true);return}drawT()}
function toggleT(){if(T.run)stopT();else{T.run=true;T.id=setInterval(tick,1000);drawT()}}
function setLen(n){stopT();store.len=n;save();T.len=n*60;T.left=T.len;drawT();if(S.view==='home')render()}
$('#tmr').addEventListener('click',toggleT);

/* ================= pausa activa ================= */
const ACT=[
 {t:'Estira el cuerpo',d:'Ponte de pie, estira los brazos hacia el techo y cuenta lento hasta 10. Repite 3 veces.'},
 {t:'10 saltos suaves',d:'Haz 10 saltos en tu lugar y después respira hondo 3 veces.'},
 {t:'Toma agua',d:'Ve a buscar un vaso de agua y tómalo con calma antes de volver.'},
 {t:'Respiración cuadrada',d:'Inhala en 4 segundos, aguanta 4, exhala en 4 y espera 4. Repite 4 veces.'},
 {t:'Da una vuelta',d:'Camina por la casa o la sala y vuelve a tu puesto.'},
 {t:'Aprieta y suelta',d:'Aprieta los puños fuerte durante 5 segundos y suéltalos. Hazlo también subiendo los hombros.'}
];
const B={left:60,id:null,i:0};
function showAct(){const a=ACT[B.i];$('#brkT').textContent=a.t;$('#brkD').textContent=a.d;if(voiceOn())seq([a.t+'. '+a.d])}
function drawB(){$('#brkN').textContent=B.left;$('#brkArc').style.strokeDashoffset=326.73*(1-B.left/60)}
function openBreak(fromTimer){
  B.i=Math.floor(Math.random()*ACT.length);B.left=60;
  $('#brkE').textContent=fromTimer?'Bloque de enfoque terminado · Pausa activa':'Pausa activa';
  $('#brk').hidden=false;showAct();drawB();clearInterval(B.id);
  B.id=setInterval(()=>{B.left--;drawB();if(B.left<=0){clearInterval(B.id);$('#brkT').textContent='¡Listo! Ya puedes volver';$('#brkD').textContent='Cuando quieras, sigue con otra misión.';if(voiceOn())seq(['¡Listo! Ya puedes volver.'])}},1000);
  $('#brkDone').focus();
}
function closeBreak(){clearInterval(B.id);stopVoice();$('#brk').hidden=true}
$('#brkDone').addEventListener('click',closeBreak);
$('#brkOther').addEventListener('click',()=>{B.i=(B.i+1)%ACT.length;showAct()});

{const sid=sess.get();const u=sid&&AUTH.users.find(x=>x.id===sid);if(u&&!u.blocked)U=u}
drawV();drawT();render();

try{if(window.claude&&window.claude.use)window.claude.use('downloads').then(d=>{DL=d;if(DL&&S.view==='panel')render()}).catch(()=>{})}catch(e){}
